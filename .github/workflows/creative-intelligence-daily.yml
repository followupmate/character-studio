name: Creative Intelligence - Daily Optimization

on:
  schedule:
    # Run at 6:00 AM UTC every day
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 3. Install Python dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Add any Python requirements here
          # pip install -r requirements.txt

      # 4. Run Creative Intelligence Optimizer
      - name: Run Creative Intelligence Optimizer
        run: |
          echo "Starting Creative Intelligence Daily Optimization..."
          python lib/autonomous_optimizer.py
          echo "Optimization complete!"

      # 5. Commit and push results
      - name: Commit optimization results
        run: |
          git config user.name "Creative Intelligence Bot"
          git config user.email "bot@github.com"
          git add data/production_strategy.json data/motion_library.json data/daily_optimization_report.json
          git commit -m "[AUTO] Daily Creative Intelligence optimization - $(date -u +'%Y-%m-%d %H:%M:%S UTC')" || true
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 6. (Optional) Notify Slack
      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "✅ Creative Intelligence Daily Optimization Complete",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Creative Intelligence Daily Report*\nDaily batch generated and ready for click-to-generate.\n\nCheck: /dashboard/creative-intelligence"
                  }
                }
              ]
            }

      # 7. (Optional) Notify Slack on failure
      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "❌ Creative Intelligence Daily Optimization Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Error in daily optimization*\n\nCheck workflow logs for details."
                  }
                }
              ]
            }
