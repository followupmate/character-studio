        block("Story Safe Zones", "Keep the top 250 pixels clear for the profile pill and the progress bars, and the bottom 320 pixels clear for the reply bar. Anything important in those bands will be covered. Design the emptiness in deliberately \u2014 it is where your text goes.", "REMEMBER"),
        p("Story \u2014 Text-Ready Top", "Compose at 9:16 with her positioned in the lower two-thirds of the frame and the upper third occupied by a simple continuous surface \u2014 open sky, a plain wall, out-of-focus water \u2014 with even tone and low detail so overlaid text will be legible against it. Her head sits below the top twenty percent of the frame. The empty area should be slightly darker than mid-gray so white text reads cleanly."),
        p("Story \u2014 POV Walking", "A 9:16 point-of-view frame shot from her own eye level looking forward along a path, boardwalk or street, with her own hand, a coffee cup or her shoes visible entering the bottom of the frame. Slight downward tilt. The world converges toward the center. Handheld, mid-stride, with the corresponding subtle motion softness. This is the highest-volume story format there is \u2014 it costs nothing and it always works."),
        p("Story \u2014 Mirror OOTD", "A full-length 9:16 mirror selfie showing the complete outfit from head to shoes. She is standing at a slight angle with one hip out and one knee soft, phone held at chest height and partly obscuring her torso, elbow out. The mirror shows realistic glass character and the room behind her is genuinely lived-in. Even ambient light with no flash. Head clear of the top eighteen percent, feet clear of the bottom twenty."),
        p("Story \u2014 Top-Down Flatlay", "A 9:16 overhead frame of objects arranged on a surface with no person in it: whatever she is currently doing, eating, buying or packing. Natural window light from one side casting soft directional shadows. The arrangement is casual and slightly off-grid rather than styled. Large negative space in the upper third for text."),
        p("Story \u2014 Close Detail", "A tight 9:16 macro-adjacent detail from her day: the condensation on a cup, sand on a shin, rings on a hand, a receipt, a coffee ring on a table. Extremely shallow depth of field with only a narrow band in focus. Natural light. No face, no context, no explanation. These are the connective tissue of a good story sequence."),
        p("Story \u2014 The Poll Setup", "A 9:16 frame composed as two clean vertical halves \u2014 two outfits laid out side by side, two drinks, two routes \u2014 with a clear dividing line down the center and matched lighting on both sides. The center band is left visually quiet so a poll sticker can sit across it. Shot flat and evenly lit so neither side is favored.")
      ]},
      { id: "g-7-4", title: "7.4 On-Image Text", items: [
        prose("Nano Banana renders text far better than previous image models. Specify the font character in words rather than naming a typeface, and keep the string short \u2014 long strings still garble."),
        p("Handwritten Overlay", "Add the text \u201c[SHORT PHRASE]\u201d across the upper third of the image in a casual handwritten script \u2014 thin, slightly irregular strokes, natural baseline drift, in a soft off-white. It should look like it was written with a stylus directly on the photo. Keep the letterforms clean and correctly spelled. Do not add any other text, watermark or graphic element."),
        p("Caption Bar", "Add a horizontal band across the lower third of the image in a semi-transparent black, with the text \u201c[SHORT PHRASE]\u201d centered inside it in a clean geometric sans-serif, all lowercase, generously letter-spaced, in white. The band spans the full width. Simple, legible, and correctly kerned. Nothing else added."),
        p("Date / Location Stamp", "Add a small camera-style timestamp in the lower right corner reading \u201c[DATE]\u201d in a segmented orange digital typeface, exactly as an early digital camera would burn in. It should be slightly transparent and sit on top of the image grain rather than beneath it. No other additions."),
        p("Quote Card", "Generate a 9:16 graphic with a soft blurred photographic background of an out-of-focus coastline at golden hour, and the text \u201c[SHORT PHRASE]\u201d centered in the middle third in a light-weight serif with generous line spacing, in warm off-white. High legibility, generous margins, nothing else in the frame. Correct spelling and even spacing.")
      ]}
    ]
  },
  {
    id: "s08", num: "08", title: "Video",
    summary: "Prompt anatomy for motion, image-to-video from your best still, first/last-frame transitions, talking-to-camera, b-roll and loops. 32 prompts.",
    groups: [
      { id: "g-8-1", title: "8.1 Video Prompt Anatomy", items: [
        prose("Google\u2019s guidance for Veo describes a five-element structure that transfers cleanly to Kling, Seedance and Runway. Effective prompts land at roughly 100\u2013150 words \u2014 three to six sentences."),
        table(["Element", "What to specify"], [
          ["Subject", "Who, in the same locked tokens you use for stills. For image-to-video the still carries this."],
          ["Action", "One clear physical action with a beginning and an end. \u201cShe turns from the window toward camera and starts to smile.\u201d"],
          ["Camera", "Static, handheld, slow push in, pull back, orbit, pan, whip. State whether it is locked off or breathing."],
          ["Setting", "Environment, time of day, weather, what is moving in the background."],
          ["Aesthetics", "Lens, lighting, grade, grain, aspect ratio, and pacing."],
          ["Audio", "Ambient bed, specific sound effects, and any dialogue in quotes. Models that generate audio invent something forgettable if left blank."]
        ]),
        note("Three rules that save clips: 1) One action per clip \u2014 4\u20138 seconds holds exactly one beat. 2) Start from a still you already love \u2014 image-to-video inherits identity, wardrobe and grade for free. 3) If you keep getting the wrong shot size, change the action, not the adjective.")
      ]},
      { id: "g-8-2", title: "8.2 Image-to-Video from Your Best Still", items: [
        p("The Subtle Alive", "Animate this image with minimal, natural motion. She breathes \u2014 a slow visible rise and fall through the chest and shoulders. She blinks twice at an irregular interval. A few strands of hair drift in a light breeze. Her eyes make a small saccade to one side and return. The camera holds nearly static with a very slight handheld breath, no more than a couple of pixels of drift. Everything else in the frame stays exactly as it is. Ambient audio only: the room tone or the environment of this location, no music, no dialogue. Four seconds.", "START HERE", "The most useful video prompt in the document. It turns any good still into a story slide."),
        p("Slow Push In", "Animate with a slow, steady dolly push toward the subject over the full duration, closing from a medium shot to a medium close-up. She holds her position and expression, blinking once, with hair moving faintly. The background compresses slightly as the camera moves. Smooth, controlled, no acceleration. Ambient audio matching the location. Six seconds."),
        p("Turn to Camera", "She begins facing away, then turns her head and shoulders toward the lens over about two seconds, her hair swinging with the motion and settling. Her expression shifts from neutral to a small genuine smile as she completes the turn, arriving in eye contact. The camera is static. Natural weight and follow-through in the movement \u2014 the head arrives before the hair does. Ambient audio. Five seconds."),
        p("Walking Toward Lens", "She walks toward the camera from about fifteen feet away, with the camera slowly retreating to hold the framing. Natural walking mechanics: correct arm swing opposing the legs, the head rising and falling slightly with each step, and hair and clothing responding with a beat of delay. She looks down, then up at the lens, then away. Handheld camera with realistic operator movement. Footsteps in the audio bed. Six seconds."),
        p("Hair in the Wind", "A gust of onshore wind moves through the frame. Her hair lifts and swings across her face, she raises one hand to pull it back, and the loose fabric of her clothing ripples in the same direction. The motion has real physics \u2014 hair moves as strands with slightly different timing, not as a solid mass. She squints slightly against it and laughs. Wind noise across the microphone in the audio. Five seconds."),
        p("Orbit", "The camera orbits smoothly around the subject through roughly forty-five degrees while she stays in position, revealing the environment behind her and changing her relationship to the light \u2014 what was a key becomes a rim as the camera travels. She tracks the camera with her eyes. Parallax between foreground and background elements is correct throughout. Six seconds.")
      ]},
      { id: "g-8-3", title: "8.3 Talking to Camera", items: [
        p("Selfie Vlog, Walking", "Vertical 9:16 selfie video, front camera at arm\u2019s length, held slightly above eye level. She is walking along a coastal path in the morning and talking directly to the lens, the frame bouncing with each step and the background moving past behind her. Natural conversational delivery with real pauses, filler words and a glance away mid-thought. Wind noise on the mic, footsteps, distant surf. She says: \u201c[LINE \u2014 keep it under twelve words].\u201d Eight seconds."),
        p("Sitting Down, Talking", "Vertical 9:16, phone propped against something so the camera is completely static at a slightly low angle. She is sitting cross-legged on a bed or a floor talking to the lens, gesturing with her hands, occasionally looking away to think and then back. Soft window light from one side. Room tone in the audio and no music. She says: \u201c[LINE].\u201d Eight seconds."),
        p("Car, Parked, Talking", "Vertical 9:16 from a phone mounted or propped on the dash, camera static, her in the driver\u2019s seat with the seatbelt on and the car not moving. Late afternoon light through the windshield across her face. She is mid-thought, animated, glancing at herself in the frame occasionally. Ambient traffic outside and the low hum of the car. She says: \u201c[LINE].\u201d Eight seconds."),
        p("Get Ready With Me", "Vertical 9:16, static camera on a bathroom or desk mirror, her in frame doing her makeup and talking to the reflection. She keeps applying while talking, glancing between her own face and the lens. Ring light or window light. Realistic multitasking \u2014 she pauses mid-sentence to concentrate and picks up again. Ambient bathroom audio. She says: \u201c[LINE].\u201d Eight seconds."),
        p("Reaction, No Words", "Vertical 9:16, front camera, static. She reacts to something off-screen without speaking: her eyebrows go up, she leans back slightly, her mouth opens, she laughs and covers her face with one hand. Entirely non-verbal, four distinct beats in four seconds. Ambient room audio only. This is the highest-reuse clip you can make \u2014 it fits under any voiceover."),
        p("Whisper-Close ASMR Framing", "Vertical 9:16, front camera held very close so her face fills most of the frame and the wide angle exaggerates the nearest features. Dim warm light. She speaks quietly and slowly, close to the mic, with the intimate low-volume delivery that sits well under a quiet track. She says: \u201c[LINE].\u201d Six seconds.")
      ]},
      { id: "g-8-4", title: "8.4 B-Roll & Lifestyle Motion", items: [
        p("Coffee Pour", "Static macro shot of milk being poured into coffee in a ceramic cup, the two liquids swirling and blooming into each other in real fluid dynamics. Soft window light from behind creating a glow through the steam. Shallow depth of field with only the surface of the liquid in focus. The pour starts, continues, and tapers. Sound of the pour and the cup settling. Four seconds."),
        p("Feet in the Water", "Camera looking straight down at her feet in the shallow wash at the beach, foam surging up over her ankles and retreating, sand shifting and eroding around her heels as the water pulls back. Her toes flex. Late afternoon light, sharp shadows. Sound of surf close and immediate. Five seconds."),
        p("Hand Through a Rack", "Close shot of her hand pushing hangers along a clothing rail one at a time, fabric shifting and hangers clicking. Shallow focus following the hand. Fluorescent thrift store light. Sound of hangers and distant store ambience. Four seconds."),
        p("Car Window Blur", "Camera pointed out a moving car window at coastline passing by, everything smeared with horizontal motion blur, occasional palm trees and poles flicking through frame, the horizon steady behind the blur. Late afternoon, warm. Sound of road noise and wind. Six seconds."),
        p("Door Opening to the View", "Handheld camera pushing through a doorway from a dim interior out onto a bright balcony or beach path, the exposure ramping as the camera moves from dark to light and briefly overexposing before settling. Her hand pushes the door on the way. Sound goes from muffled interior to open exterior. Five seconds."),
        p("Sunset Timelapse, Her Still", "The sun visibly descends and the sky shifts through orange to violet over the duration while she sits nearly motionless in silhouette, moving only slightly. Clouds streak across the frame at accelerated speed. Static locked-off camera. Ambient wind and surf slowed and stretched. Eight seconds."),
        p("Spinning in a Dress", "She spins once, slowly, the fabric of her dress lifting and lagging behind her rotation with correct weight and delay before settling. Hair follows a beat late. The camera holds static at a low angle. Golden hour backlight so the fabric glows translucent as it lifts. Ambient outdoor audio. Four seconds."),
        p("Dog Pulling the Frame", "Handheld POV from her own hand holding a leash, the dog pulling ahead and the camera being tugged forward with it, the frame bouncing and swinging with the walk. Boardwalk or path passing below. Sound of the collar, panting, footsteps. Five seconds of chaotic, joyful, unpolished motion.")
      ]},
      { id: "g-8-5", title: "8.5 Transitions & Structured Sequences", items: [
        p("First Frame \u2192 Last Frame", "Using the first image as the opening frame and the second as the closing frame, generate a natural transition between them. She moves continuously from the first pose to the second with correct physical weight and follow-through, the camera drifts smoothly from the first framing to the second, and the light changes gradually rather than cutting. No morphing, no teleporting \u2014 every intermediate frame must be physically plausible. Six seconds.", "", "The single most powerful video feature currently available. Generate two stills you love, let the model connect them."),
        p("Outfit Change Whip", "She stands in an outfit, throws one arm across the lens in a fast horizontal motion causing a whip blur that briefly fills the frame, and as the blur clears she is in a completely different outfit in the same position and lighting. The blur must be motion-realistic and last about four frames. Same location, same light, same pose. Whoosh in the audio. Four seconds."),
        p("Match Cut on Motion", "She raises a cup toward the lens until it fills the frame and goes out of focus; as it clears, she is in a different location holding a different cup at the same point in the motion. The two halves must match exactly in framing, hand position and camera height so the cut is invisible. Continuous audio across the cut. Five seconds."),
        p("Day-in-the-Life Shot List", "Generate as eight separate four-second clips, all matching in grade and identity: 1. Alarm and eyes opening, close, in bed. 2. Feet hitting the floor. 3. Coffee pour, macro. 4. Walking out the front door into the light. 5. POV walking down a street. 6. Sitting somewhere, talking to the lens. 7. Golden hour, hair in the wind, no words. 8. Back in bed, phone light on her face, lights out. Cut together, this is a complete Reel.")
      ]},
      { id: "g-8-6", title: "8.6 Loops & Cinemagraphs", items: [
        p("Seamless Loop", "Generate a clip that loops seamlessly: the final frame must match the first frame exactly in position, expression, hair placement and lighting, so the video can repeat with no visible cut. The motion is a complete cycle \u2014 a full breath, a single hair movement out and back, one wave arriving and receding. Static camera. Four seconds."),
        p("Cinemagraph \u2014 Only One Thing Moves", "Everything in the frame is completely frozen except for one isolated element: only the steam rises, or only her hair moves, or only the water ripples. She holds absolutely still including her blink. The contrast between the stillness and the single motion is the entire effect. Locked-off camera, no drift at all. Six seconds, looping."),
        p("Breathing Portrait", "A near-still portrait where the only motion is breathing, two irregular blinks and the smallest drift of hair. The camera is completely locked. The effect should be uncanny in a subtle way \u2014 a photograph that has not quite stopped. Ambient audio only. Loops."),
        p("Parallax Still", "Animate this photograph with a slow 2.5D parallax move: the camera drifts laterally about two inches while the foreground, subject and background separate at different rates according to their true depth. Nothing in the scene itself moves. Occlusion at the edges is handled correctly as the perspective shifts. Five seconds.")
      ]},
      { id: "g-8-7", title: "8.7 Continuity Across Clips", items: [
        block("Video Continuity Block", "Maintain exact continuity with the reference: same face and facial structure, same hair length, styling and part, same wardrobe including every visible garment, jewelry, nail color and footwear, same tattoos on the same limbs with the same orientation, same location, same time of day, same lighting direction and color temperature, same lens character and same color grade. Nothing about her appearance or the environment changes between this clip and the reference.", "PASTE INTO EVERY CLIP"),
        note("Shoot the still first, then generate every clip from it. Keep clips at four to eight seconds \u2014 beyond that, drift compounds. Cut on motion, not on stillness. Grade last, together \u2014 match all clips to one reference frame after generation.")
      ]}
    ]
  },
  {
    id: "s09", num: "09", title: "Troubleshooting & Quality Control",
    summary: "Failure-to-fix table, the four-round refinement workflow, and a 14-point check before anything gets posted.",
    groups: [
      { id: "g-9-1", title: "9.1 Failure \u2192 Fix", items: [
        table(["Symptom", "Actual cause", "Fix"], [
          ["Waxy, plastic skin", "No texture instruction; the default is smooth", "Run the De-Plastic pass (\u00a72.4). Add pore, peach-fuzz and sheen language permanently."],
          ["Face drifts between images", "Too few references, or trait tokens changed wording", "Four to six references, a multi-angle character sheet, identical verbatim descriptors."],
          ["Hands are wrong", "Hands were buried at the end of a long prompt", "Do not fix in the main pass. Run the isolated Fix the Hands prompt (\u00a72.4) as a second round."],
          ["Teeth look like a keyboard", "Model defaults to uniform rectangles", "Run Fix the Teeth (\u00a72.4), or avoid open-mouth smiles in base generations."],
          ["Eyes don\u2019t match", "Independent generation of each iris", "Fix the Eyes (\u00a72.4), specifying identical iris pattern and matched catchlight placement."],
          ["Tattoo moved / flipped", "No continuity lock, or an unflagged mirror", "Paste the Tattoo Continuity Lock (\u00a73.4) into every prompt. For mirrors, use \u00a73.6."],
          ["Lighting doesn\u2019t match the scene", "Subject and background composed independently", "Name the light source, its direction, and one thing it does to the environment. Never say \u201cgood lighting.\u201d"],
          ["Colors are screaming", "Model default plus a saturated color word", "Use restrained color language, then run a desaturation pass. \u201cMuted olive\u201d not \u201cvibrant green.\u201d"],
          ["Too symmetrical, too perfect", "Nothing asked for imperfection", "Run the De-AI Pass (\u00a72.9). Add asymmetry and one mundane flaw."],
          ["Background is nonsense", "You described the subject and ignored the environment", "Give the background as much specificity as the subject, including its depth of field and lighting."],
          ["Jewelry changes shot to shot", "Accessories described loosely", "Add jewelry to the identity block, not the wardrobe block, and be specific about count and placement."],
          ["Text is garbled", "String too long, or a named typeface", "Under six words, describe the font in adjectives, generate text as its own final pass."],
          ["Edit changed things you didn\u2019t ask about", "No lock clause, or two instructions in one pass", "One change per pass, always closed with the lock clause (\u00a70.2)."],
          ["Everything looks like a stock photo", "Prompt described a concept, not a photograph", "Name a device, a light source, a time of day and a flaw. Specifics produce photos."]
        ])
      ]},
      { id: "g-9-2", title: "9.2 The Four-Round Workflow", items: [
        prose("Almost nothing good comes out of one generation. Budget four passes per hero image \u2014 the cost per run is low enough that iteration is always the right call."),
        table(["Round", "Purpose", "What you do"], [
          ["1 \u2014 Composition", "Get the frame right", "Full eight-block prompt with references. Generate 3\u20135 variants; pick on composition and facial proportion, ignoring flaws."],
          ["2 \u2014 Face", "Lock identity and detail", "Feed the winner back in. Refine facial detail only, everything else frozen."],
          ["3 \u2014 Local", "Kill the specific problems", "One isolated fix per run: hands, then the necklace clasp, then the hair edge against the sky."],
          ["4 \u2014 Finish", "Grade, grain, degrade", "Match to your series reference, then run the De-AI pass. Upscale last if you need the resolution."]
        ])
      ]},
      { id: "g-9-3", title: "9.3 Pre-Post Checklist", items: [
        block("Fourteen Checks", "Zoom to 200% and go down the list: 1) Five fingers on each hand, correct proportion? 2) Both irises the same color and pattern? 3) Catchlights in the same relative position in each eye? 4) Earrings present on both sides, or deliberately one? 5) Tattoos on the correct limbs, correct orientation? 6) All shadows falling in the same direction? 7) Contact shadow where she meets the ground? 8) Any background text actually spelled correctly? 9) Straps and seams that begin somewhere and end somewhere? 10) Skin texture visible at 200%, not blurred? 11) Hair meeting the background with individual strands? 12) Reflections geometrically correct in any glass or water? 13) Nothing important in the top or bottom eighth? 14) Does it still look right at thumbnail size?", "BEFORE ANYTHING GETS POSTED")
      ]}
    ]
  },
  {
    id: "s10", num: "10", title: "Field Notes: What the Research Says",
    summary: "Published, tested techniques from Google\u2019s own docs and the practitioner community, with sources.",
    groups: [
      { id: "g-10-1", title: "10.1 From Google\u2019s Own Documentation", items: [
        prose("Describe the scene, do not list keywords \u2014 a narrative paragraph outperforms a comma-separated list of adjectives essentially every time. Use semantic negatives: describe the desired state positively (instead of \u201cno cars,\u201d describe a deserted street showing no signs of traffic). Think like a photographer: name camera angles, lens types and lighting. Edits inherit the input aspect ratio \u2014 usually; if it drifts, state it directly. When multiple images with differing ratios are supplied, the model tends to adopt the ratio of the last one. Refine iteratively \u2014 multi-turn conversation with small adjustments beats one enormous prompt.")
      ]},
      { id: "g-10-2", title: "10.2 The Eight-Category Photorealism Framework", items: [
        prose("The most complete practitioner framework in circulation is AI Video Bootcamp\u2019s eight-category model (March 2026). Its central argument: photorealism comes from prompting technique rather than model choice."),
        table(["Category", "Working principle"], [
          ["Realism triggers", "Two or three explicit realism phrases at the front. Without them the model defaults to something subtly stylized."],
          ["Camera & lens", "Naming a camera type and focal length switches from illustration to photography mode. 35mm most natural, 50mm most human, 85mm best faces."],
          ["Lighting", "Specificity beats quality words. Fantasy lighting language actively damages realism."],
          ["Texture & imperfection", "The highest-impact and most-overlooked category. AI defaults to smooth, and smooth reads as fake."],
          ["Color restraint", "Over-saturation is one of the fastest ways to read as generated. Muted and earthy language produces muted results."],
          ["Composition", "Terms like \u201ccandid moment\u201d and \u201cunstaged composition\u201d measurably increase perceived authenticity."],
          ["Grain & sensor character", "The finishing layer. Subtle grain and shadow noise are what the eye associates with a real capture."],
          ["Negative guardrails", "Important for human subjects. Combine with positive texture instructions; on Gemini, phrase them semantically."]
        ])
      ]},
      { id: "g-10-3", title: "10.3 Character Consistency \u2014 Tested Findings", items: [
        prose("Four to six reference images is the measured sweet spot; 1\u20133 gives poor multi-angle understanding, 7\u201314 causes fidelity to drop as the model averages conflicting details. Reference standards matter more than count: ~1024px, even frontal lighting, no obstructions (harsh side shadows get read as a permanent facial trait). The multi-angle character sheet works. Trait-token locking is real \u2014 \u201csharp emerald green eyes, almond shape\u201d outperforms \u201cgreen eyes\u201d substantially. Partial denoising is why edit mode works. Nothing achieves 100% consistency \u2014 plan for a selection step in every round.")
      ]},
      { id: "g-10-4", title: "10.4 Video Prompting \u2014 Current Consensus", items: [
        prose("The five-element structure \u2014 subject, action, camera, setting, aesthetics \u2014 is the shape Google\u2019s Veo guidance recommends, with 100\u2013150 words cited as the productive range. Audio is a first-class input. \u201cIngredients to video\u201d \u2014 supplying reference images of a character, object or style \u2014 is the current best mechanism for cross-shot consistency. First-frame / last-frame transitions generate a natural move between two supplied stills. When the model returns the wrong shot size, changing the action beats repeating the prompt.")
      ]},
      { id: "g-10-5", title: "10.5 What Is Actually Working on Instagram Right Now", items: [
        prose("Harsh flash and digicam degradation are the authenticity signal \u2014 low resolution, blown highlights and CCD color noise now function as defensive markers against the perception of AI. The photo dump remains structurally dominant: mixed-quality carousels combining a hero, faceless detail shots, object photography and at least one deliberately bad frame outperform single polished posts. Hyperreal mundane \u2014 cereal at midnight, sitting in traffic, staring at a phone in bed. The practical implication: your most polished generations should be the minority of what you post. Sections 5 and 6 exist for a reason.")
      ]},
      { id: "g-10-6", title: "10.6 Sources", items: [
        prose("Google Developers Blog \u2014 How to prompt Gemini image generation. Google Cloud \u2014 Gemini image generation best practices. Google Cloud Blog \u2014 Ultimate prompting guide for Veo 3.1. AI Video Bootcamp \u2014 The Ultimate Guide to Photorealistic AI Prompts (March 2026). Prompting Systems \u2014 Nano Banana Pro Character Consistency Guide. APIYI \u2014 Nano Banana Pro Face Consistency Guide. WaveSpeedAI \u2014 Nano Banana Pro Edit Ultra model card. Reel \u2014 20 Best Nano Banana Pro Prompts. ImagineArt \u2014 Nano Banana Pro Prompting Guide. LTX \u2014 Veo 3.1 Prompt Guide. Aesthetics of Photography \u2014 The Viral Visual Grammar of US Instagram in 2026. DIY Photography \u2014 How Gen Z Is Redefining Photography with Lo-Fi Aesthetics.")
      ]}
    ]
  },
  {
    id: "s11", num: "11", title: "Disclosure, Labeling & Staying Clean",
    summary: "SynthID, platform AI labels, sponsored-content rules, and likeness boundaries.",
    groups: [
      { id: "g-11-1", title: "11.1 What You Should Know", items: [
        prose("Google models embed SynthID \u2014 everything generated through Gemini carries an invisible watermark, and a visible one as well. Assume any image you produce is detectably AI-generated. Meta applies AI labels; disclosing proactively in the bio is a substantially better position than being labeled after the fact. Sponsored content follows the same rules as any other creator \u2014 disclose clearly and conspicuously. Do not build her out of a real person; keep the reference set synthetic. Be careful with trademarks and real venues \u2014 describe locations generically. Keep her an adult and keep it clean."),
        block("A Bio Line That Works", "AI-generated. Not a real person. \u2014 costs nothing, satisfies most platform expectations, and turns out to be a feature rather than a liability. The accounts that grow in this space are the ones that are open about what they are.", "PLAIN IN THE BIO")
      ]}
    ]
  },
  {
    id: "sA", num: "A\u2013C", title: "Appendices",
    summary: "The modular prompt builder, the snippet bank, and a 30-day content calendar.",
    groups: [
      { id: "g-a", title: "Appendix A Â· The Modular Builder", items: [
        prose("Pull one item from each column, assemble in the order shown, add the Realism Tail. Roughly forty thousand combinations before you repeat yourself."),
        table(["Time & light", "Location type", "Wardrobe", "Pose / action", "Camera"], [
          ["6am marine layer, flat and silver", "Wet sand at low tide", "Oversized crewneck, bike shorts", "Mid-stride, looking down", "iPhone main, 24mm, eye level"],
          ["8am, low warm sun between buildings", "Sandstone bluff edge", "Cropped baby tee, cargo pants", "Half-turned, caught mid-laugh", "iPhone front camera, arm\u2019s length"],
          ["11am, marine layer burning off", "Boardwalk with palms", "Linen set, sandals", "Leaning on a railing, watching", "35mm f/2, from across the street"],
          ["1pm hard overhead sun", "Coffee shop window seat", "Vintage tee, baggy jeans", "Sitting, chin in hand", "50mm f/1.8, seated eye level"],
          ["4pm warm and hazy", "Alley with a mural", "Slip dress, cardigan off one shoulder", "Crouched, reaching for something", "85mm f/1.4, from a distance"],
          ["6:45pm golden, long shadows", "Parking lot at night", "Hoodie over a swimsuit, wet hair", "Walking away, glancing back", "Digicam CCD, flash on"],
          ["Blue hour, city lights coming on", "Kitchen counter", "Sweats and a stretched tank", "Mid-yawn, unaware", "Disposable film, always-flash"],
          ["10pm, single practical source", "Bed, unmade", "Old tee, one sock", "Lying down, phone above her face", "35mm film, warm stock"],
          ["Dark, phone screen only", "Backseat of a moving car", "Puffer, beanie, gloves", "Spinning, arms out, hair mid-swing", "Night mode, 3-second handheld"],
          ["Overcast, no shadows at all", "Grocery aisle, fluorescent", "Matching set, grip socks", "Eating, mid-bite, deadpan", "Action cam, ultra wide, water on lens"]
        ])
      ]},
      { id: "g-b", title: "Appendix B Â· Snippet Bank", items: [
        block("B1 \u2014 Identity Block", "Subject: the same woman as the reference images. [AGE], [FEATURES], [EYE COLOR + SHAPE], [HAIR COLOR, LENGTH, TEXTURE, PART], [DISTINGUISHING MARKS], [BUILD]. Preserve facial structure exactly: same jawline width, same nose bridge, same eye spacing, same lip shape, same eyebrow arch. Skin shows real pores and faint natural texture. Do not beautify, slim, or smooth the face."),
        block("B2 \u2014 Realism Tail", "Photographic realism, not illustration and not 3D render. Visible pores, faint uneven tone, natural shine on the nose and forehead, fine peach fuzz catching the light. Stray hair flyaways breaking the silhouette. Fabric shows weave, wrinkles and real drape. Lighting is physically consistent across shadow direction, contact shadows and reflected bounce. Slight asymmetry in face and pose. Mild sensor noise in the shadows, natural corner falloff, restrained natural color."),
        block("B3 \u2014 Edit Lock Clause", "Keep everything else in the image identical: same face, same facial structure, same expression, same hair, same wardrobe, same pose, same background, same lighting direction, same color grade, same framing and aspect ratio. Change only what is described above."),
        block("B4 \u2014 Tattoo Continuity Lock", "Tattoos must match the reference exactly: same designs, same limbs, same side of the body, same scale relative to her anatomy, same rotation relative to the limb axis, same ink density and healing state. None added, removed, resized, mirrored or moved. Any tattoo occluded by clothing, hair, body position or the frame edge in this pose is correctly hidden rather than drawn through the obstruction."),
        block("B5 \u2014 Ink Physics", "Render the tattoo as pigment within the skin rather than an image applied on top of it. Skin texture, pores and fine hair remain visible across the inked area. Healed ink reads soft blue-black rather than pure black, fine lines slightly thickened. The tattoo receives the scene's lighting exactly as the surrounding skin does, with any sheen sitting above the ink. Edges are marginally soft, not vector-crisp."),
        block("B6 \u2014 Aspect Ratio Command", "Output at [4:5 / 1:1 / 9:16 / 3:2 / 16:9]. Do not change the input aspect ratio or crop. Keep the subject clear of the top eighteen percent and the bottom twenty percent of the frame."),
        block("B7 \u2014 Video Continuity", "Maintain exact continuity with the reference: same face and facial structure, same hair length and part, same wardrobe including jewelry, nails and footwear, same tattoos on the same limbs, same location, same time of day, same lighting direction and color temperature, same lens character, same color grade."),
        block("B8 \u2014 The De-AI One-Liner", "Add ordinary photographic imperfection: slight facial and postural asymmetry, imperfect focus with the eyes sharp and the extremities soft, sensor noise heavier in the shadows, fifteen percent less saturation, one mundane flaw in the environment, and a horizon about one degree off level.")
      ]},
      { id: "g-c", title: "Appendix C Â· Thirty Days of Content", items: [
        prose("A posting rhythm built from this library. The ratio that matters: roughly one polished hero for every three low-effort posts, and at least one faceless slide in every carousel."),
        table(["Day", "Post", "Prompts"], [
          ["1, 8, 15, 22, 29", "Hero location post \u2014 the polished 4:5 that anchors the week", "\u00a74 location + \u00a71.1 or 1.2 + \u00a77.1"],
          ["2, 9, 16, 23, 30", "Photo dump carousel \u2014 6 to 9 mixed-quality slides", "\u00a77.2 carousels A\u2013C"],
          ["3, 10, 17, 24", "At-home candid \u2014 kitchen, couch, floor, laundry", "\u00a75.2"],
          ["4, 11, 18, 25", "Reel \u2014 talking to camera or a b-roll cut", "\u00a78.3 or \u00a78.4 + \u00a78.5 shot list"],
          ["5, 12, 19, 26", "The lazy one \u2014 bed, front camera, no effort", "\u00a76.2"],
          ["6, 13, 20, 27", "Everyday SoCal \u2014 gas station, grocery, taco shop", "\u00a74.8"],
          ["7, 14, 21, 28", "Flash chaos \u2014 direct flash, badly framed, posted anyway", "\u00a75.1"],
          ["Daily", "3\u20135 stories \u2014 POV walk, detail shot, flatlay, poll", "\u00a77.3"]
        ]),
        note("The prompts in this document are starting points, not scripture. The accounts that work are the ones where a specific person with specific taste is making specific choices \u2014 the one thing no prompt library can supply. Change the outfits, break the formulas, keep the ones that sound like her and throw out the ones that don\u2019t.")
      ]}
    ]
  }
];


(function(){

  var clip = function(s,n){ s=String(s||"").replace(/\s+/g," ").trim(); return s.length>n? s.slice(0,n).replace(/\s+$/,"")+"\u2026":s; };

  var copyBtn = function(active, id){
    var st = "border:1px solid "+(active?"var(--accent)":"var(--line)")+";background:"+(active?"var(--accent)":"transparent")+";color:"+(active?"oklch(0.99 0.01 70)":"var(--muted)")+";font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;padding:6px 11px;border-radius:7px;cursor:pointer;flex:0 0 auto;white-space:nowrap;transition:all .15s ease;";
    return '<button data-copy="'+id+'" style="'+st+'">'+(active?"Copied \u2713":"Copy")+'</button>';
  };

  function build(){

    var html = "";

    html += '<div style="display:flex;flex-direction:column;gap:6px;margin-top:26px;">';
    (MB.facts||[]).forEach(function(f){ html += '<div style="display:flex;gap:12px;align-items:baseline;font-size:13px;color:var(--muted);"><span style="width:6px;height:6px;flex:0 0 6px;border-radius:50%;background:var(--accent2);transform:translateY(-2px);"></span><span style="line-height:1.4;">'+esc(f)+'</span></div>'; });
    html += '</div></header>';

    html += '<div style="max-width:1020px;">';

    // playbooks
    html += '<section id="sec-playbooks" style="padding:60px 68px 34px;border-bottom:1px solid var(--line);scroll-margin-top:24px;">';
    html += '<div style="font-family:\'JetBrains Mono\',monospace;font-size:11px;letter-spacing:0.28em;text-transform:uppercase;color:var(--accent2);">Workflows \u00b7 not a chapter</div>';
    html += '<h2 style="font-family:\'Newsreader\',serif;font-weight:500;font-size:40px;line-height:1.0;letter-spacing:-0.018em;margin:14px 0 0;">Order of Operations</h2>';
    html += '<p style="font-size:15.5px;line-height:1.62;color:var(--muted);max-width:700px;margin:16px 0 0;text-wrap:pretty;">From reference image and first prompt all the way to a final, Instagram-worthy frame \u2014 no plastic skin, no AI look. Five repeatable playbooks for the situations a 22-year-old creator actually posts. Each step names what to do and hands you the prompt to run.</p>';
    html += '<div style="display:flex;flex-direction:column;gap:28px;margin-top:40px;">';
    PB.forEach(function(pb,pi){
      var domId="pb-"+pi, open=!!state.openPb[domId], num=(pi+1<10?"0":"")+(pi+1);
      index.push({domId:domId,title:pb.title,crumb:"Playbook \u00b7 workflow",snippet:clip(pb.scenario,66),hay:(pb.title+" "+pb.scenario+" "+pb.tag+" playbook workflow order of operations").toLowerCase()});
      html += '<article id="'+domId+'" style="border:1px solid var(--line);background:var(--card);border-radius:10px;overflow:hidden;scroll-margin-top:24px;">';
      html += '<div data-toggle="'+domId+'" style="padding:20px 24px;background:var(--tint);cursor:pointer;">';
      html += '<div style="display:flex;align-items:baseline;gap:14px;"><span style="font-family:\'JetBrains Mono\',monospace;font-size:15px;font-weight:700;color:var(--accent-ink);">'+num+'</span>';
      html += '<h3 style="font-family:\'Newsreader\',serif;font-weight:500;font-size:25px;line-height:1.05;margin:0;flex:1 1 auto;">'+esc(pb.title)+'</h3>';
      html += '<span style="font-family:\'JetBrains Mono\',monospace;font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:var(--faint);">'+pb.steps.length+' steps</span>';
      html += '<span style="display:inline-flex;align-items:center;gap:6px;font-family:\'JetBrains Mono\',monospace;font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:oklch(0.99 0.01 70);background:var(--accent);border-radius:6px;padding:5px 10px;">'+(open?"Collapse":"View steps")+'<span style="font-size:11px;">'+(open?"\u25be":"\u25b8")+'</span></span></div>';
      html += '<div style="display:flex;align-items:baseline;gap:10px;margin-top:6px;"><span style="font-family:\'JetBrains Mono\',monospace;font-size:9.5px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--accent2);">'+esc(pb.tag)+'</span></div>';
      html += '<p style="font-size:13.5px;line-height:1.55;color:var(--muted);margin:10px 0 0;max-width:760px;text-wrap:pretty;">'+esc(pb.scenario)+'</p></div>';
      if(open){
        html += '<div style="padding:4px 24px 20px;border-top:1px solid var(--line);">';
        pb.steps.forEach(function(s,si){
          var sDom="pbs-"+pi+"-"+si;
          index.push({domId:domId,title:s.title,crumb:pb.title,snippet:clip(s.body,66),hay:(s.title+" "+s.body+" "+(s.prompt||"")).toLowerCase()});
          html += '<div style="display:flex;gap:16px;padding:18px 0;border-bottom:1px solid var(--line);">';
          html += '<div style="flex:0 0 30px;width:30px;height:30px;border-radius:50%;background:var(--accent);color:oklch(0.99 0.01 70);font-family:\'JetBrains Mono\',monospace;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;">'+(si+1)+'</div>';
          html += '<div style="flex:1 1 auto;min-width:0;"><div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;"><span style="font-family:\'Newsreader\',serif;font-size:18px;font-weight:500;line-height:1.2;">'+esc(s.title)+'</span>';
          if(s.ref) html += '<span style="font-family:\'JetBrains Mono\',monospace;font-size:9.5px;letter-spacing:0.08em;color:var(--accent-ink);border:1px solid var(--line);border-radius:5px;padding:2px 6px;">'+esc(s.ref)+'</span>';
          html += '</div><p style="font-size:14px;line-height:1.6;color:var(--muted);margin:6px 0 0;text-wrap:pretty;">'+esc(s.body)+'</p>';
          if(s.prompt){
            html += '<div style="margin-top:12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);overflow:hidden;"><div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--line);"><span style="font-family:\'JetBrains Mono\',monospace;font-size:9px;letter-spacing:0.16em;text-transform:uppercase;color:var(--faint);">Prompt</span>'+copyBtn(state.copiedId===sDom,sDom)+'</div><p data-prompt="'+sDom+'" style="font-family:var(--prompt-font);font-size:12.5px;line-height:1.7;color:var(--ink);margin:0;padding:12px 14px;white-space:pre-wrap;">'+esc(s.prompt)+'</p></div>';
          }
          html += '</div></div>';
        });
        html += '</div>';
      }
      html += '</article>';
    });
    html += '</div></section>';

    // chapters
    LIB.forEach(function(ch,ci){
      var chDom="ch-"+ch.id;
      html += '<section id="'+chDom+'" style="padding:60px 68px 30px;border-bottom:1px solid var(--line);scroll-margin-top:24px;">';
      html += '<div style="display:flex;align-items:baseline;gap:20px;"><div style="font-family:\'JetBrains Mono\',monospace;font-size:34px;font-weight:700;color:var(--accent-ink);line-height:1;">'+esc(ch.num)+'</div><h2 style="font-family:\'Newsreader\',serif;font-weight:500;font-size:38px;line-height:1.02;letter-spacing:-0.015em;margin:0;">'+esc(ch.title)+'</h2></div>';
      html += '<p style="font-size:15px;line-height:1.6;color:var(--muted);max-width:680px;margin:16px 0 0;text-wrap:pretty;">'+esc(ch.summary)+'</p>';
      ch.groups.forEach(function(g,gi){
        html += '<div style="margin-top:44px;"><h3 style="font-family:\'JetBrains Mono\',monospace;font-size:12px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:var(--ink);margin:0 0 20px;padding-bottom:10px;border-bottom:1.5px solid var(--ink);">'+esc(g.title)+'</h3>';
        html += '<div style="display:flex;flex-direction:column;gap:18px;">';
        g.items.forEach(function(it,ii){
          var domId="it-"+ci+"-"+gi+"-"+ii, flashed=state.flashId===domId;
          var title=it.title||"";
          if(it.type!=="sub"){
            index.push({domId:domId,title:title||g.title,crumb:ch.num+" \u00b7 "+g.title.replace(/^[0-9.]+\s*/,"").replace(/^[A-C]\s\u00b7\s/,""),snippet:clip(it.body||it.summary||g.title,66),hay:(title+" "+(it.body||"")+" "+(it.label||"")+" "+g.title+" "+ch.title+" "+ch.num).toLowerCase()});
          }
          var wrap='border-radius:9px;transition:box-shadow .4s ease,background .4s ease;'+(flashed?'box-shadow:0 0 0 3px var(--accent);background:var(--tint);padding:5px;margin:-5px;':'box-shadow:none;padding:0;margin:0;');
          html += '<div id="'+domId+'" style="'+wrap+'">';
          if(it.type==="prompt"){
            html += '<article style="border:1px solid var(--line);background:var(--card);border-radius:8px;overflow:hidden;"><div style="display:flex;align-items:flex-start;gap:16px;justify-content:space-between;padding:15px 18px 12px;border-bottom:1px solid var(--line);"><div style="min-width:0;"><div style="font-family:\'Newsreader\',serif;font-size:19px;font-weight:500;line-height:1.15;">'+esc(title)+'</div>';
            if(it.label) html += '<div style="font-family:\'JetBrains Mono\',monospace;font-size:9.5px;letter-spacing:0.18em;text-transform:uppercase;color:var(--accent-ink);margin-top:5px;">'+esc(it.label)+'</div>';
            html += '</div>'+copyBtn(state.copiedId===domId,domId)+'</div><p data-prompt="'+domId+'" style="font-family:var(--prompt-font);font-size:13px;line-height:1.72;color:var(--ink);margin:0;padding:15px 18px 16px;white-space:pre-wrap;">'+esc(it.body)+'</p>';
            if(it.note) html += '<div style="display:flex;gap:9px;align-items:baseline;padding:0 18px 15px;"><span style="font-family:\'JetBrains Mono\',monospace;font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent2);flex:0 0 auto;">Tip</span><span style="font-family:\'Newsreader\',serif;font-style:italic;font-size:14px;line-height:1.45;color:var(--muted);">'+esc(it.note)+'</span></div>';
            html += '</article>';
          } else if(it.type==="block"){
            html += '<article style="border:1px dashed var(--accent-ink);background:var(--tint);border-radius:8px;overflow:hidden;"><div style="display:flex;align-items:center;gap:16px;justify-content:space-between;padding:12px 18px;border-bottom:1px dashed oklch(0.72 0.07 152);"><div style="min-width:0;"><div style="font-family:\'JetBrains Mono\',monospace;font-size:11px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent-ink);">'+esc(title)+'</div>';
            if(it.label) html += '<div style="font-family:\'JetBrains Mono\',monospace;font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:var(--faint);margin-top:3px;">'+esc(it.label)+'</div>';
            html += '</div>'+copyBtn(state.copiedId===domId,domId)+'</div><p data-prompt="'+domId+'" style="font-family:var(--prompt-font);font-size:12.5px;line-height:1.7;color:var(--ink);margin:0;padding:14px 18px;white-space:pre-wrap;">'+esc(it.body)+'</p>';
            if(it.note) html += '<div style="font-family:\'Newsreader\',serif;font-style:italic;font-size:14px;line-height:1.45;color:var(--muted);padding:0 18px 14px;">'+esc(it.note)+'</div>';
            html += '</article>';
          } else if(it.type==="prose"){
            html += '<p style="font-size:15px;line-height:1.68;color:var(--ink);max-width:680px;margin:0;text-wrap:pretty;">'+esc(it.body)+'</p>';
          } else if(it.type==="note"){
            html += '<div style="display:flex;gap:11px;align-items:baseline;padding:12px 16px;background:var(--tint);border-radius:8px;max-width:700px;"><span style="font-family:\'JetBrains Mono\',monospace;font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent2);flex:0 0 auto;padding-top:2px;">Note</span><span style="font-family:\'Newsreader\',serif;font-style:italic;font-size:15px;line-height:1.5;color:var(--muted);">'+esc(it.body)+'</span></div>';
          } else if(it.type==="table"){
            html += '<div class="wc-scroll" style="overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--card);"><table style="border-collapse:collapse;width:100%;font-size:12.5px;"><thead><tr>';
            (it.columns||[]).forEach(function(c){ html += '<th style="text-align:left;font-family:\'JetBrains Mono\',monospace;font-size:9.5px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--accent-ink);padding:11px 14px;border-bottom:1.5px solid var(--ink);vertical-align:bottom;background:var(--tint);">'+esc(c)+'</th>'; });
            html += '</tr></thead><tbody>';
            (it.rows||[]).forEach(function(row){ html += '<tr>'; row.forEach(function(cell){ html += '<td style="padding:10px 14px;border-bottom:1px solid var(--line);line-height:1.5;color:var(--ink);vertical-align:top;">'+esc(cell)+'</td>'; }); html += '</tr>'; });
            html += '</tbody></table></div>';
          }
          html += '</div>';
        });
        html += '</div></div>';
      });
      html += '</section>';
    });

    html += '<footer style="padding:40px 68px 90px;color:var(--faint);font-family:\'JetBrains Mono\',monospace;font-size:10px;letter-spacing:0.22em;text-transform:uppercase;">'+esc(MB.title)+' \u00b7 Nano Banana Pro Edit Ultra \u00b7 v1.0</footer>';
    html += '</div>';
    document.getElementById("main").innerHTML = html;

    buildNav();
    buildSearch();
    wire();
  }

  function buildNav(){
    var nav = document.getElementById("nav"); nav.innerHTML="";
    LIB.forEach(function(ch){
      var dom="ch-"+ch.id, on=state.activeId===dom;
      var a=document.createElement("a"); a.href="#"+dom;
      a.style.cssText="display:flex;gap:6px;align-items:baseline;padding:7px 10px;border-radius:8px;cursor:pointer;color:"+(on?"var(--ink)":"var(--muted)")+";background:"+(on?"var(--tint)":"transparent")+";";
      a.innerHTML='<span style="font-family:\'JetBrains Mono\',monospace;font-size:11px;font-weight:500;width:34px;flex:0 0 34px;color:var(--accent-ink);">'+esc(ch.num)+'</span><span style="font-size:13px;line-height:1.25;">'+esc(ch.title)+'</span>';
      a.addEventListener("click",function(e){ e.preventDefault(); jumpTo(dom); });
      nav.appendChild(a);
    });
  }

  function buildSearch(){
    var box=document.getElementById("results"); var q=(state.query||"").trim().toLowerCase();
    if(q.length<2){ box.style.display="none"; box.innerHTML=""; document.getElementById("clearbtn").style.display=state.query?"block":"none"; return; }
    document.getElementById("clearbtn").style.display="block";
    var scored=[];
    index.forEach(function(x){ var t=x.title.toLowerCase(),score=-1; if(t.indexOf(q)>=0)score=t.indexOf(q)===0?0:1; else if(x.hay.indexOf(q)>=0)score=2; if(score>=0)scored.push({x:x,score:score}); });
    scored.sort(function(a,b){return a.score-b.score;});
    var res=scored.slice(0,40);
    var label=res.length?(res.length+(res.length>=40?"+ matches":(res.length===1?" match":" matches"))):"Search";
    var h='<div style="font-family:\'JetBrains Mono\',monospace;font-size:9.5px;letter-spacing:0.14em;text-transform:uppercase;color:var(--faint);padding:10px 13px 6px;">'+label+'</div>';
    if(!res.length){ h+='<div style="padding:14px 13px;font-size:12.5px;color:var(--faint);">No matches. Try a place, a camera, or a topic.</div>'; }
    res.forEach(function(s,i){ h+='<button data-jump="'+s.x.domId+'" style="display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:transparent;cursor:pointer;padding:9px 13px;"><div style="font-family:\'JetBrains Mono\',monospace;font-size:9px;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent-ink);">'+esc(s.x.crumb)+'</div><div style="font-family:\'Newsreader\',serif;font-size:14.5px;color:var(--ink);margin-top:2px;line-height:1.2;">'+esc(s.x.title)+'</div><div style="font-size:11px;color:var(--faint);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+esc(s.x.snippet)+'</div></button>'; });
    box.innerHTML=h; box.style.display="block";
  }

  var flashT, copyT;
  function jumpTo(domId){
    if(domId.indexOf("pb-")===0) state.openPb[domId]=true;
    state.query=""; document.getElementById("search").value=""; state.flashId=domId;
    build();
    var el=document.getElementById(domId);
    if(el){ var y=el.getBoundingClientRect().top+window.scrollY-22; window.scrollTo({top:y,behavior:"smooth"}); }
    clearTimeout(flashT); flashT=setTimeout(function(){ state.flashId=null; build(); },2200);
  }

  function doCopy(text,id){
    var done=function(){ state.copiedId=id; build(); clearTimeout(copyT); copyT=setTimeout(function(){ state.copiedId=null; build(); },1600); };
    try{ if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done,done); else { var ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); done(); } }catch(e){ done(); }
  }

  function wire(){
    document.querySelectorAll("[data-toggle]").forEach(function(el){ el.addEventListener("click",function(){ var id=el.getAttribute("data-toggle"); state.openPb[id]=!state.openPb[id]; build(); }); });
    document.querySelectorAll("[data-copy]").forEach(function(el){ el.addEventListener("click",function(e){ e.stopPropagation(); var id=el.getAttribute("data-copy"); var p=document.querySelector('[data-prompt="'+id+'"]'); doCopy(p?p.textContent:"",id); }); });
    document.querySelectorAll("[data-jump]").forEach(function(el){ el.addEventListener("click",function(){ jumpTo(el.getAttribute("data-jump")); }); });
  }

  // static sidebar wiring
  document.getElementById("search").addEventListener("input",function(e){ state.query=e.target.value; buildSearch(); wire(); });
  document.getElementById("clearbtn").addEventListener("click",function(){ state.query=""; document.getElementById("search").value=""; buildSearch(); document.getElementById("search").focus(); });
  document.getElementById("gotoplaybooks").addEventListener("click",function(e){ e.preventDefault(); jumpTo("sec-playbooks"); });

  window.addEventListener("scroll",function(){
    if(window.__raf) return; window.__raf=requestAnimationFrame(function(){ window.__raf=null;
      var active=null; LIB.forEach(function(ch){ var el=document.getElementById("ch-"+ch.id); if(el&&el.getBoundingClientRect().top<=140) active="ch-"+ch.id; });
      if(active&&active!==state.activeId){ state.activeId=active; buildNav(); }
    });
  },{passive:true});

  build();
})();
</script>
</body>
</html>
