  {
    id: "pb-hero",
    title: "Polished Location Feed Post",
    tag: "Feed Â· 4:5 Â· the weekly anchor",
    scenario: "One clean, believable location shot for the grid \u2014 the post everything else hangs off. Budget four rounds; the cost per run is low enough that iterating is always right.",
    steps: [
      { title: "Build the reference set", body: "Feed the model 4\u20136 references (never 7+): a front view, a 45\u00b0 three-quarter and a full profile, even frontal light, minimum 1024px, no sunglasses or hands on the face. Lock your trait tokens now \u2014 the exact words for her eyes, hair and marks \u2014 and never reword them.", ref: "\u00a70.5" },
      { title: "Generate the base frame", body: "Full eight-block prompt: lead with identity, pick a location from Section 04, end with the Realism Tail. Generate 3\u20135 variants and choose on composition and facial proportion only \u2014 ignore skin, hands and small flaws for now.", ref: "\u00a70 Â· \u00a74", prompt: "The woman from the reference images, identity preserved exactly \u2014 [AGE], [EYE COLOR + SHAPE], [HAIR], [DISTINGUISHING MARKS]. Standing on the grass bluff above La Jolla Cove at 8am with the marine layer still low over the water and the light flat and silver. Oversized crewneck over bike shorts, hair in a claw clip with strands escaping, holding an iced coffee. Turned three-quarters away, caught mid-turn back. iPhone 15 Pro Max main camera, 24mm, eye level. Photographic realism, not illustration: visible pores, faint uneven tone, natural shine on the nose and forehead, fine peach fuzz, stray flyaways breaking the silhouette. Slight asymmetry in face and pose, mild sensor noise in the shadows, restrained natural color. 4:5 vertical." },
      { title: "Lock the face (Round 2)", body: "Feed the winner back in and refine facial detail only, everything else frozen. This is where identity is nailed down before you touch anything else.", ref: "\u00a72.10", prompt: "Refine the facial detail only. Sharpen the eyes, restore individual eyelashes, resolve the iris texture, recover pore structure across the nose and cheeks, and correct any softness or asymmetry that is not deliberate. Maintain the exact facial structure, proportions, expression and identity. Keep everything outside the face untouched." },
      { title: "De-plastic the skin", body: "The single highest-impact realism pass. Run it on every hero. Smooth skin is the loudest AI tell there is.", ref: "\u00a72.4", prompt: "Restore realistic skin to the face, neck, chest and arms. Reintroduce visible pores that vary in size across regions \u2014 larger on the nose and inner cheeks, finer on the forehead. Add subtle uneven tone: faint redness across the cheeks and nostrils, cooler tone under the eyes. Include fine peach fuzz along the jawline catching the light, a couple of faint freckles, one small blemish. Keep natural sheen on the nose and forehead. Do not change facial structure, features, expression, makeup, hair, wardrobe, pose or lighting." },
      { title: "Kill the specific tells (Round 3)", body: "One isolated fix per run \u2014 do not batch them. Hands first (they were buried at the end of the base prompt and will be wrong), then eyes, then teeth if her mouth is open, then jewelry or a hair edge against the sky.", ref: "\u00a72.4", prompt: "Correct the hands. Each hand has exactly five fingers with correct proportion \u2014 middle finger longest, little finger reaching the top joint of the ring finger, thumb opposing naturally. Knuckles show creases, nail beds have cuticles and lunulae, subtle tendon structure on the back of the hand. The pose is anatomically possible and relaxed. Match the lighting, skin tone and grain of the rest of the image exactly. Change nothing else." },
      { title: "Grade for the feed", body: "Pick one hero image as your permanent grade reference and match every post to it \u2014 this is what makes a grid look like one person's eye rather than a stock library.", ref: "\u00a72.3", prompt: "Match the color grade of this image to the reference image. Copy its white balance, contrast curve, black point, saturation level, grain structure and the way it renders skin tone. Do not copy any content, composition, lighting or subject \u2014 color treatment only. Everything else stays exactly as it is." },
      { title: "The De-AI pass (Round 4)", body: "The most useful prompt in the whole library. It degrades the image toward an ordinary photo taken by a person on an ordinary day \u2014 asymmetry, imperfect focus, sensor noise, one mundane flaw.", ref: "\u00a72.9", prompt: "Degrade this image toward the quality of an ordinary photograph taken by a person on an ordinary day. Break the perfect symmetry of the face and pose \u2014 one eye slightly different, the smile marginally uneven, the shoulders not level. Introduce imperfect focus: eyes sharp but the ears and nose tip falling off, a hair of motion softness in the hands. Add sensor noise heavier in the shadows, pull saturation back about fifteen percent, add one small mundane flaw to the environment, and let the horizon sit about one degree off level. Preserve identity, wardrobe, pose, location and lighting exactly." },
      { title: "Reframe & run the checklist", body: "Reframe to 4:5 if it drifted, then zoom to 200% and go down the 14-point pre-post checklist: five fingers, matched irises, consistent shadow direction, contact shadow on the ground, skin texture intact, hair meeting the background as strands, nothing important in the top or bottom eighth.", ref: "\u00a72.6 Â· \u00a79.3" }
    ]
  },
  {

    scenario: "The low-effort post that outperforms the polished one. Harsh flash and phone-grade quality now read as authenticity. The trap is over-fixing it \u2014 restraint is the whole skill here.",
    steps: [
      { title: "Attach the reference, expect less", body: "Use your locked reference set, but accept that flash + front-camera quality will be lower fidelity than a hero. That degradation is the point, not a bug to fix.", ref: "\u00a70.5" },
      { title: "Generate the direct-flash frame", body: "Careless framing, unmotivated light, an expression caught between two states, and real clutter in frame. Generate a couple and pick the most accidental-looking one.", ref: "\u00a75.1", prompt: "A photo taken on a phone in a dark room with the flash firing straight at her from the lens position. Flat unmotivated light: her face a stop overexposed with hot points on the nose and forehead, a hard-edged shadow on the wall behind her, everything past six feet near-black. Colors punchy and slightly wrong. Caught mid-expression, not at the peak \u2014 half a laugh, one eye slightly more closed. Careless framing, off-center, phone tilted a few degrees, a charging cable and a water bottle visible. Front-camera quality: soft detail, noise in the shadows. Oversized washed-out tee and sweatpants. 9:16 vertical." },

      { title: "Add evidence she was there", body: "One small realism nudge \u2014 sweat sheen, windblown hair, sand on a shin \u2014 then stop. Post it raw; no grade match, flash chaos reads better ungraded.", ref: "\u00a72.9", prompt: "Add the physical evidence that she has actually been in this environment: a light sheen across the forehead and nose bridge, windblown hair that has not been re-styled, faint flush across the cheeks. Small and specific. Do not change facial structure, expression or wardrobe." }

      { title: "Layer on just-woke-up detail", body: "Push the morning realism \u2014 pillow crease, wrecked hair, an ear reddened from the pillow, eyes not yet focused.", ref: "\u00a76.4", prompt: "Add: a pillow crease running diagonally across one cheek and fading toward the jaw, hair flattened and creased on the contact side with a section standing up at the crown, slight redness on the ear that was against the pillow, marginal facial asymmetry from sleeping on one side, and eyes that have not fully focused \u2014 pupils slightly wide, gaze a few degrees off the lens." },
      { title: "De-plastic + tired face", body: "Restore skin texture and add genuine exhaustion signals \u2014 heavy lids, faint under-eye shadow, a softened, expressionless face.", ref: "\u00a72.4 Â· \u00a76.4", prompt: "Add the physical signs of genuine tiredness: mild puffiness in the lower lids, faint blue-violet shadow under both eyes, a marginally sallow cast, eyes a touch glassy with slightly reddened lower waterlines, heavy lids, and a general softening of facial muscle tone so the face holds no expression. Reintroduce real skin texture with visible pores and uneven tone. Lips slightly dry. Do not change facial structure." },

const p = (title, body, label, note) => ({ type: "prompt", title, body, label: label || "", note: note || "" });

const LIBRARY = [
  {
    id: "s00", num: "00", title: "The Operating System",
    summary: "The 8-block prompt formula, edit-mode rules, aspect ratios, identity locking, and the three snippets you will paste into almost every prompt.",

      { id: "g-0-1", title: "0.1 The Eight-Block Formula", items: [
        prose("Every prompt in this library is built from the same eight blocks. Learn the blocks once and you can write your own forever â€” and diagnose why a bad generation went bad. Nano Banana is a language model that happens to output pixels. It rewards narrative description over keyword soup: a paragraph beats a comma salad every single time."),

          ["5. Camera", "Device, focal length, aperture, height, angle. Puts the model in photography mode.", "\u201ciPhone main camera, 24mm equivalent, held at chest height, slight upward tilt\u201d"],

          ["8. Grade", "Color treatment, contrast, grain, capture-device artifacts.", "\u201cslightly crushed blacks, warm highlights, faint sensor noise in the shadows\u201d"]

      { id: "g-0-2", title: "0.2 Generate Mode vs. Edit Mode", items: [

      ]},

      { id: "g-0-5", title: "0.5 Identity Locking", items: [
        prose("Face drift is the number one thing that kills an AI persona. The fix is three layers running at once. Layer 1 \u2014 Reference images: feed four to six references; fidelity peaks in that range and degrades past seven. Minimum 1024px, even frontal light, no sunglasses. Build a character sheet with a front view, a 45\u00b0 three-quarter and a full profile. Layer 2 \u2014 Trait tokens: pick the exact words for her features and never change them. Layer 3 \u2014 Session memory: define her fully in the first message, then use short follow-ups."),
        block("Identity Block", "Subject: the same woman as the reference images. [AGE] years old, [ETHNIC/FEATURE DESCRIPTORS], [EYE COLOR + SHAPE], [HAIR COLOR, LENGTH, TEXTURE, PART], [DISTINGUISHING MARKS: freckle map, beauty mark, ear piercings, tooth gap], [BUILD/HEIGHT]. Preserve facial structure exactly: same jawline width, same nose bridge, same eye spacing, same lip shape, same eyebrow arch. Skin shows real pores and faint natural texture. Do not beautify, slim, or smooth the face.", "FILL ONCE, REUSE FOREVER"),
        note("The mirror trap: mirror selfies flip everything \u2014 text reverses, a hair part swaps sides, and tattoos land on the wrong limb. If generating a mirror shot, say so explicitly and state which details mirror and which do not. See \u00a73.6.")
      ]},
      { id: "g-0-6", title: "0.6 The Realism Tail", items: [
        block("Realism Tail", "Photographic realism, not illustration and not 3D render. Skin has visible pores, faint uneven tone, a little natural shine on the nose and forehead, and fine peach fuzz catching the light. Hair has stray flyaways breaking the silhouette. Fabric shows weave, wrinkles and how it actually hangs on a body. Lighting is physically consistent \u2014 shadow direction, contact shadows and reflected bounce all agree with one another. Slight asymmetry in the face and pose. Mild sensor noise in the shadows, natural lens falloff toward the corners, restrained natural color rather than boosted saturation.", "PASTE AT THE END OF ANY GENERATION PROMPT")
      ]}
    ]
  },
  {
    id: "s01", num: "01", title: "The Camera & Fidelity Engine",
    summary: "iPhone photo-identical, high-end DSLR, studio, plus digicam, film, disposable, Polaroid, FaceTime and drone looks. 24 prompts.",
    groups: [
      { id: "g-1-1", title: "1.1 iPhone 15 Pro Max \u2014 Photo-Identical", items: [
        p("The Master iPhone Prompt", "Render this as a photograph captured on an iPhone 15 Pro Max using the main rear camera \u2014 48MP quad-pixel sensor binned to 24MP, 24mm equivalent focal length, f/1.78, sensor-shift optical stabilization. Reproduce Apple\u2019s computational pipeline exactly: Smart HDR 5 with lifted shadows and gently rolled-off highlights rather than clipped whites, Photonic Engine noise handling that leaves fine luminance grain in dark areas while keeping midtones clean, and Deep Fusion micro-contrast that slightly over-sharpens eyelashes, individual hair strands, fabric weave and text edges. Color science must match Apple\u2019s: warm-leaning white balance, slightly desaturated reds, greens pushed marginally toward yellow, skin tones rendered warm and true rather than pink or orange. Depth of field is the shallow-but-not-creamy look of a small sensor at 24mm \u2014 the background is separated but still legible, with no artificial cutout edge around hair. Include the honest artifacts of a real handheld capture: very slight lens distortion at the frame edges, mild corner vignetting, a faint purple-green flare if a light source is in frame, one or two barely-visible dust specks, and an imperceptible amount of motion softness in the extremities. Framing is casual and handheld \u2014 the horizon is off by about one degree, the subject is not perfectly centered. No professional retouching, no beauty filter, no skin smoothing. 4:5 vertical.", "MAIN CAMERA Â· 24MM", "This is the workhorse. Everything else in this section is a variation on it."),
        p("iPhone Ultra Wide", "Shot on the iPhone 15 Pro Max ultra wide camera at 13mm equivalent, f/2.2. Reproduce the characteristic 0.5x look: pronounced barrel distortion that stretches whatever is nearest the lens, a subject who appears slightly small in a very large environment, softening and light smearing in the extreme corners, and noticeably more noise than the main camera because of the smaller sensor. Everything from about two feet out is in focus. Deep, exaggerated sense of space. Held low and tilted up so the subject towers slightly and the sky takes the top third.", "13MM Â· 0.5X"),
        p("iPhone 5x Telephoto", "Shot on the iPhone 15 Pro Max 5x telephoto at 120mm equivalent, f/2.8, tetraprism folded optics. Compressed perspective \u2014 the background feels stacked right up behind the subject and appears larger relative to her than the eye would expect. Slightly lower contrast and marginally softer detail than the main camera, with visible computational sharpening on the edges. Handheld at distance, so there is a hair of stabilization softness. Framing is tight, waist-up, taken from across the street as if someone photographed her without her noticing.", "120MM Â· TETRAPRISM"),
        p("iPhone Front Camera", "Shot on the iPhone 15 Pro Max front-facing TrueDepth camera \u2014 12MP, f/1.9, 23mm equivalent. Arm\u2019s-length framing with the visible geometry of a real selfie: one shoulder closer to the lens, the arm holding the phone cropping into the bottom corner of the frame, mild wide-angle distortion enlarging the nose and chin very slightly. Front-camera image quality is a step below the rear \u2014 softer detail, more noise in shadows, less dynamic range, highlights that clip a little faster. Focus locks on the eyes, everything behind falls off gently without portrait-mode cutout. Slightly noisy, slightly flat, completely ordinary.", "12MP TRUEDEPTH Â· SELFIE"),
        p("iPhone Portrait Mode", "iPhone 15 Pro Max Portrait mode at f/2.0 simulated aperture. The bokeh is computational, not optical \u2014 background blur is smooth and slightly uniform in a way real glass never produces, and specular highlights render as soft rounded discs rather than true optical bokeh balls. Include the honest tell of the mode: an almost imperceptible depth-mask imperfection where a few hair strands at the edge of the silhouette are blurred along with the background. Foreground subject is sharp, the transition zone at the shoulders is graduated. Warm Studio Light applied at low strength.", "COMPUTATIONAL BOKEH"),
        p("iPhone Night Mode", "iPhone 15 Pro Max Night mode, roughly a three-second handheld exposure. Reproduce the signature look: shadows lifted far beyond what the eye would see, so the dark parts of the frame are visible but slightly gray and plasticky, noticeable luminance noise in the flat areas, and a subtle watercolor smearing where noise reduction has scrubbed fine texture. Any moving element carries a soft multi-frame ghost. Point light sources bloom and star slightly. Color is cool overall with warm pools around streetlights. She is very slightly soft because nobody holds perfectly still for three seconds.", "3-SECOND HANDHELD"),
        p("iPhone Flash at Night", "iPhone 15 Pro Max rear camera with the True Tone flash firing in a dark environment. Harsh, flat, direct on-axis light: skin is bright and slightly overexposed at the nose and forehead, a hard-edged shadow falls on the wall directly behind her, everything more than six feet back drops to near-black, and there is visible red-eye reduction warmth in the eyes. Colors go punchy and slightly wrong \u2014 whites turn faintly blue, skin picks up a hot spot. Zero flattery, maximum immediacy. This is the aesthetic that currently outperforms polished photography on Instagram.", "TRUE 2026 HOUSE STYLE"),
        p("iPhone ProRAW", "Shot in Apple ProRAW on the iPhone 15 Pro Max and graded manually afterward, not by the phone. Compared to a standard iPhone JPEG this has lower contrast, more highlight information retained in the sky, less aggressive shadow lifting so the dark areas actually stay dark, minimal sharpening, and a hand-set white balance that leans slightly cool. Grain is fine and film-like rather than digitally scrubbed. The look of someone who knows what they are doing but is still shooting on a phone.", "FLAT FILE, GRADED BY HAND"),
        p("Screenshot of a Photo", "Render this as if it were a screenshot taken of an iPhone photo displayed inside the Photos app, then cropped \u2014 slightly reduced sharpness from the re-encode, marginally elevated black point, and the faint banding in smooth gradients that comes from double compression. No UI elements visible, just the degraded second-generation quality. Reads as an image that has been sent, saved and re-shared rather than exported clean.", "THE DEEP CUT", "Weirdly effective. Real photos on the internet are almost never first-generation files.")
      ]},
      { id: "g-1-2", title: "1.2 High-End DSLR & Mirrorless", items: [
        prose("The tell of a real professional camera is not sharpness \u2014 phones are sharp. It is optical falloff: how a large sensor and fast glass separate a subject from a background in three dimensions."),
        p("The Master DSLR Prompt", "Render this as a professional photograph captured on a full-frame camera with a fast 85mm prime at f/1.4 \u2014 the classic portrait combination. Reproduce true optical behavior rather than computational imitation: razor-thin plane of focus landing on the near eye with the far eye already falling off, background dissolved into smooth creamy bokeh where out-of-focus specular highlights render as soft round discs with slightly brighter rims and take on gentle cat-eye elongation toward the frame corners. Compression from the 85mm focal length flattens facial features flatteringly. Full-frame dynamic range: highlights hold texture instead of clipping, shadows retain color and detail. Skin is rendered with real micro-detail \u2014 pores, fine hairs, subtle texture variation across the cheek. Slight chromatic aberration in the extreme highlights, gentle vignetting at f/1.4. Sharpened conservatively the way a retoucher would. Shot in RAW and graded with a restrained hand: natural color, controlled contrast, no crushed blacks, no teal-and-orange. 3:2 aspect ratio.", "85MM F/1.2 PORTRAIT"),
        p("Editorial 35mm", "Full-frame mirrorless with a 35mm prime at f/1.8, shot from eye level about four feet away. Wide enough to include the environment as a character in the frame but not so wide that the face distorts. Background is present and readable but softened. Slight barrel distortion at the edges. The look of a magazine environmental portrait \u2014 the subject in context, doing something, aware of the camera but not performing for it.", "ENVIRONMENTAL PORTRAIT"),
        p("50mm Normal", "Full-frame body with a 50mm at f/2, roughly matching human perspective so nothing is exaggerated or flattered. Modest subject separation. Honest proportions. Shot at eye level with no angle trickery. This is the focal length that makes an image read as documentary rather than fashion \u2014 use it when you want her to look like a person, not a product.", "DOCUMENTARY HONESTY"),
        p("70\u2013200 Telephoto", "Shot on a 70\u2013200mm f/2.8 zoom racked to 200mm, from a considerable distance. Heavy background compression stacks the layers of the scene flat behind her. Extremely shallow depth of field isolates her completely. Very slight atmospheric haze between camera and subject from the distance. She is unaware of the lens \u2014 caught mid-motion, mid-expression, mid-sentence. The paparazzi-adjacent look, but warm rather than invasive.", "LONG LENS CANDID"),
        p("Medium Format", "Captured on a medium format digital body with an 80mm lens at f/2.8 \u2014 roughly a 50mm equivalent field of view but with the enormous sensor\u2019s signature rendering. Extraordinary tonal gradation through the skin, a shallow focus falloff that feels three-dimensional rather than simply blurry, and resolution so high that individual eyelashes and the weave of the fabric are fully resolved. Colors are deep and slightly cool. The image feels expensive in a way that is hard to name.", "THE EXPENSIVE LOOK"),
        p("Golden-Hour Backlit", "85mm at f/1.8, sun positioned directly behind the subject and just outside the frame edge. Heavy lens flare washes across the frame diagonally, lifting the blacks and reducing contrast in the lower third. A blown-out rim of light traces her hair and shoulder line, with individual backlit hair strands glowing. Her face is in soft shadow, lifted only by bounce off the ground. Warm haze. Deliberately imperfect \u2014 this is the shot where technical flaws are the point.", "85MM + SUN FLARE")
      ]},
      { id: "g-1-3", title: "1.3 Studio", items: [
        p("The Master Studio Prompt", "Render this as a professional studio photograph. The subject stands roughly four feet in front of a seamless paper backdrop in a neutral warm gray, lit so the background falls approximately one stop below her. Key light is a beauty dish with a diffusion sock, positioned high and slightly camera-left at about 45 degrees, producing crisp but not harsh shadows \u2014 a small triangle of light under the shadow-side cheekbone and a defined but soft shadow under the nose. A large white bounce card just below the chin lifts the under-eye and jaw shadows without erasing them. A stripbox behind and camera-right provides a thin rim of separation. Catchlights in both eyes are round and clearly defined, in the upper portion of the iris. Captured on a full-frame body with a 105mm lens at f/8 \u2014 deep enough that the entire face is sharp. Retouching is professional but conservative \u2014 skin texture fully intact with visible pores, no liquify, no plastic smoothing. Clean, expensive, commercial.", "SEAMLESS + BEAUTY DISH"),
        p("Clamshell Beauty", "Studio beauty lighting in clamshell configuration \u2014 a large softbox directly above and in front of the subject angled down, and a second softbox or silver reflector directly below angled up, sandwiching her face in nearly shadowless light. The result is two stacked catchlights in each eye, a tiny soft shadow directly beneath the nose and chin, and skin rendered evenly and luminously. Shot tight on the face at 105mm, f/8. Background is a clean white or soft gradient. This is cosmetics-campaign lighting.", "FLAWLESS, FRONTAL"),
        p("Hard Flash Editorial", "Studio strobe fired bare with no modifier, positioned close to the lens axis. Hard, unforgiving, high-contrast light: shadows have knife edges, a sharp dark outline traces her silhouette on the backdrop behind her, and skin texture is fully exposed. Colors go saturated and slightly aggressive. Shot on a colored seamless \u2014 deep red or electric blue. The deliberately confrontational editorial look, unretouched and proud of it.", "BARE BULB, NO MODIFIER"),
        p("High Key", "High-key studio setup: white seamless lit two stops brighter than the subject so it renders as pure paper white with no visible seam or shadow, and the subject lit frontally with two large softboxes at 45 degrees on either side. Almost no shadows on the face. Airy, clean, weightless. Ideal for a profile photo or a product-adjacent frame where the subject needs to be cleanly isolated.", "PURE WHITE, FLOATING"),
        p("Low Key", "Low-key studio portrait: black seamless backdrop receiving no light at all, a single gridded stripbox as key placed at 60 degrees camera-left and slightly above eye level, and nothing else. Most of the frame is genuine black. Light rakes across one side of her face, defines the cheekbone and jaw, and falls off into complete darkness at the far edge. A faint rim traces her shoulder. Moody, sculptural, expensive. Shot at f/5.6 on an 85mm.", "ONE LIGHT, BLACK BACKDROP"),
        p("Cyc Wall Fashion", "Full-body fashion frame on an infinity cyc wall in soft warm gray, lit evenly across the entire background with two large sources so there is no visible corner. Subject lit with a large octabox from high camera-right creating a long soft shadow across the floor toward camera-left. Full body in frame with generous headroom and floor. 50mm at f/6.3. The composition is about the silhouette of the outfit as much as the person.", "FULL BODY, WIDE"),
        p("Golden-Hour Studio Fake", "Studio setup engineered to imitate late afternoon sun indoors: a hard light source with a warm CTO gel fired through a wooden window-frame gobo, casting a sharp-edged rectangle of golden light across the subject and the wall behind her, with a soft blue fill from the opposite side standing in for skylight. Dust particles catch in the beam. She sits inside the pool of warm light with half her face in cool shadow. Every bit of it is manufactured and it looks completely real.", "WARM GEL THROUGH A WINDOW FRAME")
      ]},
      { id: "g-1-4", title: "1.4 Alternative Capture Looks", items: [
        prose("The 2026 feed is dominated by cameras that are technically worse than a modern phone. Low resolution and harsh flash read as authenticity signals precisely because AI output tends to be over-produced. Use these liberally."),
        p("CCD Digicam", "Shot on an early-2000s compact digital camera with a CCD sensor at roughly 5 megapixels. Reproduce the CCD signature precisely: cool-leaning white balance that renders skin slightly pink, blown-out highlights with no recovery, heavy chroma noise in the shadows that clusters into visible red and blue blotches, low dynamic range so the sky is white if she is exposed correctly, soft corners, mild purple fringing on high-contrast edges, and the small built-in flash firing straight on. The image is small, slightly soft, oversharpened by the camera\u2019s own JPEG engine, and completely charming. Faint date stamp in the lower right corner in orange.", "2006 POINT-AND-SHOOT"),
        p("35mm Film \u2014 Warm Stock", "Shot on 35mm color negative film with a warm portrait stock, natural light, and scanned on a lab scanner. Creamy highlight rolloff that never truly clips, gently lifted blacks with a faint warm cast rather than true black, skin tones rendered warm and slightly desaturated, greens pushed toward olive, and organic grain that is finer in the highlights and coarser in the shadows. Very slight softness overall. A tiny amount of halation glows around the brightest edges. Handheld on a compact 35mm body with a 40mm lens.", "PORTRA-STYLE"),
        p("35mm Film \u2014 Tungsten Night", "Shot at night on tungsten-balanced motion picture film stock, pushed one stop. Signature red halation blooms around every bright light source \u2014 streetlamps, neon, headlights all bleed a soft red glow into the surrounding pixels. Cool blue-cyan shadows, heavy visible grain, and rich saturated color in the lit areas. Handheld, slightly underexposed, deeply cinematic. The most flattering possible way to shoot a parking lot.", "CINESTILL-STYLE"),
        p("Black & White Film", "Black and white 35mm film pushed to 1600 ISO. Coarse, prominent grain across the whole frame. High contrast with genuinely black shadows and bright highlights, and a compressed midtone range. Slightly gritty and raw. Shot handheld with available light only, on a 35mm lens, wide open. Deep blacks in the hair, bright highlights on the skin, texture everywhere.", "HIGH CONTRAST, PUSHED"),
        p("Disposable Camera", "Shot on a single-use disposable film camera with a fixed-focus plastic lens and the flash always on. Everything about it is bad in a specific way: soft focus overall with the corners noticeably worse than the center, heavy vignetting, strong barrel distortion, colors that shift green in the shadows, the flash overexposing anything within four feet and abandoning everything beyond eight, and prominent grain from cheap high-speed film. Scanned at drugstore quality with dust and a hair visible in one corner.", "PLASTIC LENS, ALWAYS FLASH"),
        p("Instant / Polaroid", "An instant film photograph, square format inside a white border with the wider band at the bottom. Soft, low-contrast, dreamy rendering with muted pastel color and a cyan shift in the shadows. Focus is approximate. The flash has flattened the subject and dropped the background into darkness. Slight uneven chemical development creating a subtle color streak across one corner. Physically photographed at a slight angle so the border is not perfectly square to the frame.", "SQUARE, CHEMICAL"),
        p("FaceTime Screenshot", "A screenshot from a live video call. Low bitrate compression artifacts are visible in the flat areas \u2014 blocky macroblocking in the background, smeared detail around fast-moving parts of the frame, and banding in the smooth gradients. Her face is caught mid-expression, mid-word, slightly blurred by motion. Front-camera framing at arm\u2019s length, unflattering angle, poor indoor lighting from a single overhead source. Slightly stretched aspect ratio. Deeply unglamorous and totally believable.", "LOW BITRATE"),
        p("GoPro / Action Cam", "Shot on an action camera with an ultra wide lens, held at arm\u2019s length. Extreme barrel distortion curves the horizon dramatically. Everything is in focus from six inches to infinity. Aggressive in-camera contrast and saturation. Water droplets are on the lens, refracting little points of sun. Slightly overexposed sky, deep saturated blue water. Framing is chaotic because she is treading water while shooting.", "ULTRA WIDE, IN THE WATER"),
        p("Drone", "Aerial photograph from a consumer drone at roughly eighty feet, looking down at a thirty-degree angle. Slightly wide lens with mild distortion. Punchy contrast and saturated color typical of drone processing. She is small in the frame, and the composition is really about the geometry of the coastline, the parking lot lines, or the pattern of umbrellas below. Sharp throughout with a subtle atmospheric haze. Long shadow stretching away from her across the sand.", "TOP-DOWN / ORBIT"),
        p("Security Cam", "A still frame pulled from a fixed ceiling-mounted security camera. Wide fisheye coverage from a high corner angle, heavy barrel distortion, washed-out low-saturation color, visible compression noise, and mediocre low-light performance producing smeared motion. A white timestamp is burned into the upper right corner. She is unaware of the camera entirely. Unflattering, mundane, and oddly compelling as a story-slide.", "TIMESTAMP, FISHEYE")
      ]}
    ]
  },
  {
    id: "s02", num: "02", title: "Image Edits & Adjustments",
    summary: "Surgical tweaks to an image you already made: relighting, color, skin, wardrobe, hands, reframing, background, clean-up, and realism repair. 62 prompts.",
    groups: [
      { id: "g-2-1", title: "2.1 The Edit Contract", items: [
        prose("Five rules that prevent almost every collateral-damage disaster. 1) One change per pass. 2) Name the target precisely \u2014 not \u201cfix the lighting\u201d but \u201craise the exposure on her face by about two-thirds of a stop.\u201d 3) Always close with the lock clause. 4) Stack passes, don\u2019t restart \u2014 feed the output of pass one into pass two. 5) Check the aspect ratio; if it drifts, add: Do not change the input aspect ratio or crop."),
        block("Universal Edit Skeleton", "[VERB] [SPECIFIC TARGET] so that [DESIRED RESULT, described physically]. Match the existing [lighting direction / color temperature / grain structure / perspective] exactly. Keep everything else identical: same face, same expression, same hair, same wardrobe, same pose, same background, same grade, same framing and aspect ratio.", "COPY THIS SHAPE")
      ]},
      { id: "g-2-2", title: "2.2 Light & Exposure", items: [
        p("Golden Hour Relight", "Relight this scene as if it were shot forty minutes before sunset. Replace the existing light with low, warm directional sun coming from camera-left at a shallow angle, roughly 3200K. Shadows become long, soft-edged and slightly blue by contrast. Add a warm rim along her hair and the edge of her shoulder facing the sun. Skin picks up warmth on the lit side and cools in the shadow. Add gentle atmospheric haze in the background and a faint warm bloom where the sun grazes the frame. Everything else \u2014 pose, wardrobe, face, background elements \u2014 stays exactly as it is."),
        p("Window Light Relight", "Relight the subject with large soft north-facing window light entering from camera-right at roughly waist height. Produce a broad gradual falloff across her face, with the shadow side lifted by ambient room bounce rather than going black. Add a soft rectangular catchlight in both eyes matching the window shape. Cool the highlights slightly and let the shadows go neutral. Preserve pose, expression, wardrobe and background exactly."),
        p("Add Direct Flash", "Relight as if an on-camera flash fired directly at the subject from the lens position. Flatten the lighting on her face, add a hot specular highlight on the nose, forehead and cheekbones, and cast a hard-edged shadow of her silhouette onto the surface directly behind her. Drop the ambient background two stops so anything more than a few feet back goes dark. Slightly cool the overall white balance and increase color saturation. Keep her face, pose and outfit unchanged."),
        p("Fix Underexposure", "Raise the overall exposure by approximately one and a third stops, lifting the shadows more than the highlights so the tonal range opens up without the whites clipping. As brightness increases, add the noise that a genuine push would reveal \u2014 fine luminance grain concentrated in the shadow areas and a slight loss of color saturation in the darkest regions. Do not smooth or clean the image while brightening it. Everything else unchanged.", "", "Asking for the noise is what keeps a brightening pass from looking artificial."),
        p("Recover Blown Highlights", "Pull back the overexposed regions \u2014 the sky, the white fabric and the specular highlights on her skin \u2014 so that detail and texture return. Roll the highlights off gradually rather than clamping them, the way a large-sensor camera would. Do not darken the midtones or shadows in the process. Keep the color temperature and everything else in the frame identical."),
        p("Change Light Direction", "Move the primary light source from camera-right to camera-left while keeping its quality and color temperature identical. Every shadow in the frame must flip accordingly \u2014 the nose shadow, the shadow under the jaw, the cast shadow on the ground, and the shading on the background all reverse. The catchlights in her eyes move to the opposite side. Her face, pose, wardrobe and the scene itself do not change."),
        p("Day to Night", "Convert this daytime scene to night. Remove the sun entirely and relight from the practical light sources visible in the frame \u2014 streetlights, storefront windows, car headlights \u2014 each casting light of its own color temperature and direction. The sky becomes deep blue-black with a faint city glow near the horizon. Shadows deepen dramatically and lose color. Add mild sensor noise in the dark areas and slight bloom around each point light. Preserve her exact pose, expression, wardrobe, and position in frame."),
        p("Overcast to Sunny", "Change the weather from overcast to bright direct sun at roughly 2pm. Introduce a hard light source high and slightly behind camera-left, producing short crisp shadows with defined edges. Increase contrast, deepen the blue of the sky, and add specular highlights to every reflective surface. Her eyes narrow very slightly against the brightness and a small squint line appears. Everything else stays the same."),
        p("Add a Rim Light", "Add a single rim light positioned behind the subject and camera-right, at head height, slightly cooler than the existing key. It should trace a thin bright edge along the right side of her hair, jaw, shoulder and arm, with individual backlit hair strands catching the light and glowing. It must not spill onto her face or brighten the background. Everything else unchanged."),
        p("Soften Harsh Midday Light", "Soften the harsh overhead light on the subject as if a large diffusion scrim had been held above her. Open the deep shadows under her eyes, nose and chin without eliminating them entirely, reduce the specular hot spots on her forehead and nose, and lower the overall contrast on her face only. The background keeps its original harsh sunlight and contrast, which is what makes it read as a real scrim. Everything else unchanged.")
      ]},
      { id: "g-2-3", title: "2.3 Color & Grade", items: [
        p("Warm Film Grade", "Apply a warm color negative film grade. Lift the black point slightly with a warm tint so the shadows never reach true black, roll the highlights off softly, warm the overall white balance, desaturate the reds a touch while pushing greens toward olive and yellow. Add fine organic grain that is heavier in the shadows than the highlights. Keep the composition, subject and lighting structure completely unchanged."),
        p("Cool Clean Grade", "Apply a clean cool grade: neutral-to-cool white balance, true blacks, bright clean whites, restrained saturation with blues and cyans slightly emphasized. Skin stays natural rather than going gray. Low grain, high clarity. The look of a well-executed commercial edit. No other changes."),
        p("Muted / Desaturated", "Reduce overall saturation by about thirty percent, with the strongest reduction in the reds and oranges. Lift the shadows into a soft gray, compress the contrast in the highlights, and shift the whole image very slightly toward green in the midtones. Quiet, understated, editorial. Everything else identical."),
        p("Strip the Filter Off", "Remove the heavy color filter that has been applied to this image and return it to a neutral, accurate rendition. Restore natural skin tone with correct red and yellow balance, return the whites to true white, undo the crushed shadows and the lifted blacks, and normalize the contrast. The result should look like an unedited camera file. Do not change composition or content.", "", "Useful when a generation comes out over-cooked. Run this before any other grading pass."),
        p("Match to a Reference Grade", "Match the color grade of this image to the second reference image. Copy its white balance, contrast curve, black point, saturation level, grain structure and the specific way it renders skin tone. Do not copy any content, composition, lighting direction or subject from the reference \u2014 color treatment only. Everything in this image otherwise stays exactly as it is.", "", "The single most valuable prompt for making a feed look cohesive. Pick one hero image as your grade reference and run every post through this."),
        p("Cross-Process", "Apply a cross-processed film look: cyan-shifted shadows, yellow-green highlights, elevated contrast, and unnaturally saturated color in the midtones. Add moderate grain. High-contrast and slightly wrong in a deliberate way. Keep all content unchanged."),
        p("Sun-Bleached SoCal", "Grade for a sun-bleached California look: hot slightly-blown highlights, warm sand-colored midtones, shadows that lift toward warm gray rather than black, reduced contrast overall, and a very slight orange cast across the whole frame as if shot through late afternoon haze. Skin looks warm and lightly tanned. Keep everything else the same."),
        p("Black & White Conversion", "Convert to black and white using a red-filter response \u2014 skin renders bright and smooth, blue sky darkens dramatically, and freckles and blemishes soften. Deep true blacks, bright but not clipped whites, a long gradual midtone range. Add fine film grain. Do not alter contrast on her face in a way that erases skin texture.")
      ]},
      { id: "g-2-4", title: "2.4 Skin, Face & Hair", items: [
        p("De-Plastic the Skin", "Restore realistic skin to the subject\u2019s face, neck, chest, shoulders and arms. Reintroduce visible pores that vary in size and density across different regions \u2014 larger and more visible on the nose and inner cheeks, finer on the forehead and around the eyes. Add subtle uneven tone: faint redness across the cheeks and around the nostrils, a slightly cooler tone under the eyes, natural variation between forehead and jaw. Include fine peach fuzz along the jawline and hairline catching the light. Add a small number of realistic imperfections \u2014 a couple of faint freckles, one small blemish, a barely visible fine line at the outer eye. Keep a natural amount of sheen on the nose, forehead and cupid\u2019s bow rather than a uniform matte finish. Do not change facial structure, features, expression, makeup, hair, wardrobe, pose or lighting.", "RUN ON EVERYTHING"),
        p("Subtle Skin Cleanup", "Reduce the most prominent blemishes on her face by about seventy percent, leaving faint traces rather than removing them entirely. Even out the strongest patches of redness while preserving the natural variation in tone. Do not smooth pores, do not blur, do not change skin texture anywhere, and do not alter facial structure or features. The result should look like good skin, not retouched skin."),
        p("Fix the Eyes", "Correct the eyes. Both irises must be identical in color and pattern, with a visible fibrous iris texture and a defined limbal ring. Pupils are equal in size and correctly centered. Add a single primary catchlight in each eye, positioned identically relative to each iris and consistent with the direction of the key light in the scene, plus one much smaller secondary reflection. Whites are slightly off-white with faint visible vessels near the corners, not pure white. Individual lower lashes are visible and sparse. Keep eye shape, spacing, brow position and everything else in the image unchanged."),
        p("Fix the Teeth", "Correct the teeth so they read as real. They should be slightly off-white with subtle variation in shade between individual teeth, marginally translucent at the biting edges, and naturally imperfect in alignment \u2014 not a uniform row of identical rectangles. The gum line follows a natural asymmetric curve. The upper teeth are visible and the lower teeth are mostly in shadow. Match the count and proportion to a real adult mouth. Do not change her lip shape, expression, or anything else."),
        p("Fix the Hands", "Correct the hands. Each hand has exactly five fingers with correct proportion \u2014 the middle finger longest, the ring and index nearly equal, the little finger reaching roughly the top joint of the ring finger, and the thumb opposing at a natural angle. Knuckles show creases, nail beds have visible cuticles and lunulae, and there is a subtle tendon structure visible on the back of the hand. The pose is anatomically possible and relaxed. Match the lighting, skin tone and grain of the rest of the image exactly. Change nothing else."),
        p("Hair Flyaways", "Add realistic hair detail: a scattering of individual flyaway strands escaping the silhouette, especially around the crown and temples where they catch the light and glow. Add fine baby hairs along the hairline at the forehead and nape. A few strands cross the face naturally. The overall hairstyle, length, color, part and volume remain exactly as they are.", "", "Perfect hair silhouettes are one of the clearest AI tells. This is a two-second fix."),
        p("Wind in the Hair", "Add the effect of a light onshore breeze coming from camera-right. Several strands lift and blow across her face and away from her shoulder in the direction of the wind, with the movement consistent throughout \u2014 loose fabric on her clothing shifts in the same direction. Add a very slight motion softness to the fastest-moving strands only, keeping the face sharp. No other changes."),
        p("Change Hair Length", "Change her hair length to fall just below the collarbone, keeping the exact same color, texture, wave pattern, part and general styling. The new length must interact correctly with the light \u2014 matching shadow behavior on the shoulders and consistent shine placement. Face, expression, wardrobe, pose and background unchanged."),
        p("Wet Hair", "Make her hair wet as if she just came out of the ocean. Strands clump together into defined ropes rather than staying separate, the hair sits closer to the skull with reduced volume, the color darkens by two shades, and specular highlights become sharp and bright rather than soft. A few strands stick to her cheek and neck. Add a small number of water droplets on her shoulders and collarbone. Face and expression unchanged."),
        p("Natural Makeup", "Apply a minimal makeup look: skin evened with a sheer base that still shows texture and freckles through it, cream blush on the high cheeks blending outward, brows brushed upward and lightly filled, a single coat of mascara on the upper lashes only, and a tinted balm on the lips in a muted rose. No visible eyeliner, no contour, no highlighter. It should look like fifteen minutes of effort, not two hours. Facial structure unchanged."),
        p("Full Glam Makeup", "Apply a going-out makeup look: matte base with soft contour under the cheekbones, warm bronze eyeshadow blended into the crease, a defined winged liner, full lashes, sharp highlighter on the cheekbone and nose bridge, brushed-up brows and a muted brown-toned lip liner with gloss on top. Skin still shows texture beneath the makeup. Do not alter face shape, eye size, nose or jawline."),
        p("Remove Makeup", "Show the subject with bare skin. Remove all cosmetics: no base, no blush, no eye makeup, no lip color. Reveal her natural skin including uneven tone, visible freckles, faint redness around the nose and cheeks, natural under-eye shadow, and sparse natural brows and lashes. Lips are their natural color and slightly dry. Do not alter facial structure or expression. This should look bare, not airbrushed.")
      ]},
      { id: "g-2-5", title: "2.5 Wardrobe & Styling", items: [
        p("Swap the Outfit", "Replace her current outfit with [NEW OUTFIT: garment, cut, fabric, color, fit]. The new clothing must drape and fold according to her actual pose \u2014 compression where a strap crosses the shoulder, gathering at the waist, the correct amount of stretch at the elbow. Match the lighting exactly: the same light direction produces the same highlight and shadow placement on the new fabric, and the fabric picks up the same ambient color from the environment. Show the fabric\u2019s real texture \u2014 ribbing, weave, pilling or sheen as appropriate. Her body proportions, pose, face, hair and the background are unchanged."),
        p("Recolor One Garment", "Change only the color of her top to [COLOR], keeping the exact same garment, cut, fabric texture, fit and every fold. The new color must respond correctly to the light \u2014 highlights where the light hits, deepened saturation in the shadows, and the same reflected color bounce onto her chin and neck that the original produced, adjusted to the new hue. Nothing else in the frame changes."),
        p("Fabric Swap", "Keep the garment\u2019s shape, color and fit identical but change the material to [FABRIC: heavy ribbed cotton / slinky satin / washed denim / boucl\u00e9 knit / mesh]. Its behavior must change accordingly: how stiffly or fluidly it drapes, whether it holds a crease, how much it reflects light, and the scale of its surface texture. Everything else stays the same."),
        p("Add Jewelry", "Add a fine gold chain necklace sitting at the base of her throat, two small gold hoops in the first lobe piercing of each ear, and three thin stacked rings on her right hand. Each piece must show accurate metal behavior \u2014 sharp specular highlights that align with the scene\u2019s key light, soft reflected warmth onto the surrounding skin, and a correctly cast contact shadow. The chain follows the curve of her collarbone and sits with real weight. Nothing else changes."),
        p("Nails", "Give her a short almond-shaped manicure in a sheer milky beige with a glossy finish. Nails show a realistic curved highlight, visible cuticle line, natural nail bed color showing through at the base, and one nail with a very slight chip at the tip. Hand structure and pose unchanged."),
        p("Shoes", "Replace her footwear with [SHOE]. The new shoes must contact the ground correctly with a tight dark contact shadow at each point of contact, deform slightly where her weight sits, and show realistic wear on the sole edge and toe. Match the perspective and lighting of the frame exactly. Her stance, leg position and everything else unchanged."),
        p("Add / Remove Sunglasses", "Add oversized dark sunglasses. The lenses reflect a compressed, correctly-oriented mirror image of what is actually in front of her in this scene, with the reflection dimmer and slightly warped by the lens curvature. Her eyes are faintly visible through the tint. The frames cast a soft shadow on her cheekbones and the bridge sits correctly on her nose without distorting it. The arms disappear into her hair at the correct angle. Nothing else changes."),
        p("Layer It Up", "Add an open oversized zip hoodie worn over the existing outfit, pushed off one shoulder. The hoodie must occlude the garments beneath it correctly, cast a shadow onto her chest and arm, and drape with the weight of heavy brushed fleece \u2014 the hood bunching at the back of the neck, the hem falling past her hips, the sleeves swallowing her hands. Her pose and the existing outfit underneath remain visible and unchanged where not covered."),
        p("Add a Bag", "Place a small shoulder bag on her body, strap crossing from the opposite shoulder down to her hip. The strap must compress the fabric of her top where it crosses, the bag must hang with visible weight and swing slightly away from her body, and it must cast a contact shadow against her hip. Leather shows grain, edge wear and a soft sheen. Nothing else changes."),
        p("Seasonal Reskin", "Convert this from a summer image to a cool-weather one. Replace the outfit with weather-appropriate layering, add a light flush to her nose, cheeks and the tips of her ears, adjust the ambient light to a cooler and lower-angled winter sun, and change the background vegetation accordingly. Her face, pose, framing and camera position stay exactly the same.", "", "Lets you get four seasons of content out of one good pose.")
      ]},
      { id: "g-2-6", title: "2.6 Composition, Crop & Extend", items: [
        p("Reframe to 4:5", "Recompose this image to a 4:5 vertical aspect ratio for an Instagram feed post. Extend the frame vertically by generating additional content above and below that continues the existing scene with perfectly consistent perspective, lighting, grain and color. Position the subject on the left vertical third with her eyeline in the upper third. Leave the lower fifth relatively simple. Do not alter the subject, her pose or any existing pixels."),
        p("Reframe to 9:16", "Extend this image to a 9:16 vertical frame for an Instagram story. Generate additional scene above and below, matching perspective, lighting, texture and grain exactly. Keep the subject\u2019s head below the top eighteen percent of the frame and her body clear of the bottom twenty percent so that the interface elements and any stickers have clean space to sit. The extension should be visually quiet \u2014 sky, ground, wall \u2014 not new points of interest."),
        p("Outpaint Wider", "Extend the frame outward on all four sides by roughly forty percent, revealing more of the environment the subject is standing in. The generated area must be a plausible continuation of this specific location, with matching perspective lines converging to the same vanishing point, consistent lighting direction and falloff, matching grain and lens characteristics, and increasing distortion toward the new frame edges. The subject and all original content remain untouched."),
        p("Straighten \u2014 But Not Perfectly", "Rotate the image so the horizon is nearly level, leaving it approximately half a degree off. Correct the vertical convergence on the buildings only partially. Crop minimally to remove the resulting corner gaps. This should read as a photo taken by a person who mostly held the camera straight, not one processed by software."),
        p("Change the Camera Height", "Regenerate this exact scene from a lower camera position, roughly at chest height instead of eye level, looking slightly upward at the subject. Perspective must update correctly throughout \u2014 converging verticals, more sky, a shorter apparent horizon, and the subject appearing marginally taller and more dominant in frame. Her pose, expression, wardrobe, the lighting and the location all stay the same."),
        p("Change the Camera Angle", "Regenerate this scene from a three-quarter angle approximately forty degrees to the subject\u2019s left, keeping the camera at the same height and distance. Her body and face rotate correspondingly, revealing the far side of her face and hiding the near side. Wardrobe, hair, lighting direction relative to the world, background and grade all remain consistent with the original.", "", "Multi-angle coverage of one setup. This is how you get a carousel from a single good frame."),
        p("Zoom Out to Full Body", "Extend this waist-up frame into a full-body shot by generating her lower half and the ground she stands on. Her proportions must be anatomically consistent with the visible upper body, her stance must support her actual weight distribution, the clothing must continue logically, and her shadow must fall correctly relative to the existing light direction. Match the grain, focus falloff and color exactly."),
        p("Tighten the Crop", "Crop into a tight portrait framing from just below the collarbone to just above the crown of the head, with the eyes on the upper third line. Upscale the cropped region so detail resolves cleanly at the new size \u2014 restore individual eyelashes, pore texture, iris fiber and hair strands rather than simply enlarging the existing pixels. Preserve the original grain scale relative to the new framing.")
      ]},
      { id: "g-2-7", title: "2.7 Background & Environment", items: [
        p("Swap the Background", "Replace the background with [NEW ENVIRONMENT]. The new background must match the existing lighting on the subject exactly \u2014 same direction, same quality, same color temperature \u2014 and must be rendered at a depth of field consistent with her sharpness and her apparent distance from the camera. Add correct ambient color bounce from the new environment onto her skin and clothing edges, and place a plausible contact shadow where she meets the ground. The subject, her pose and her lighting stay untouched."),
        p("Declutter", "Clean up the background: remove the trash can, the parked cars, the signage and the stray pedestrians, reconstructing whatever should be behind them with correct perspective, lighting and texture. The environment should read as the same place, just emptier \u2014 an uncrowded stretch of that street with no signs of traffic. Do not alter the subject or the foreground."),
        p("Add Depth Separation", "Increase the separation between subject and background by adding a shallower depth of field. The blur must increase progressively with distance rather than applying uniformly, hair edges must remain individually sharp where they should be in focus, and out-of-focus highlights should render as soft round discs. Keep the subject exactly as sharp as she currently is."),
        p("Add Atmosphere", "Add light atmospheric haze to the scene, increasing with distance so the far background loses contrast and shifts slightly toward the color of the ambient light while the foreground stays clear. If a light source is in frame, add visible volumetric shafts and a scattering of dust or sea-spray particles catching the light. Subject unchanged."),
        p("Add a Crowd", "Populate the background with a handful of ordinary people at various distances, all rendered out of focus and at a scale consistent with the perspective. They are engaged in their own activities and unaware of the camera, with natural mid-motion postures. Their lighting matches the scene. None of them are near enough to be sharp or to compete with the subject. The foreground and subject stay identical."),
        p("Empty the Place Out", "Show this location completely empty except for the subject \u2014 a deserted stretch of beach with only her footprints, no other figures, no towels, no umbrellas. Reconstruct the sand, water and background as continuous unbroken environment. Everything about the subject remains unchanged."),
        p("Move the Subject in Frame", "Reposition the subject so she stands on the right third of the frame instead of the center, generating the environment that should exist where she currently is and removing her from that position cleanly. Her scale, lighting, shadow and the perspective of her body all update to be correct for the new position. The environment and camera stay the same."),
        p("Add Reflections", "Add a wet reflective surface to the ground in the foreground. The reflection must be geometrically correct \u2014 mirrored vertically from the actual contact point, compressed and increasingly broken up with distance, dimmer and lower in contrast than the source, and disturbed by subtle surface ripple. Reflect the actual elements present in this scene, including her and the light sources. Nothing above the ground plane changes.")
      ]},
      { id: "g-2-8", title: "2.8 Clean-Up & Removal", items: [
        p("Remove an Object", "Remove [OBJECT] from the frame entirely. Reconstruct what should be visible behind it \u2014 continuing the surface texture, pattern, perspective lines and lighting gradient across the gap so there is no visible seam, no smudge and no repeating pattern artifact. Remove its cast shadow and any light it was reflecting onto nearby surfaces. Everything else stays exactly the same."),
        p("Remove a Person", "Remove the person standing behind the subject and rebuild the background they were occluding, matching perspective, texture, lighting and depth of field at that distance. Remove their shadow. If any part of them overlapped the subject, reconstruct the subject\u2019s occluded edge correctly \u2014 including individual hair strands and the fabric edge of her clothing. Nothing else changes."),
        p("Remove Phone / Camera Reflection", "Remove the phone and the hand holding it from the mirror reflection, reconstructing the reflected chest, torso and background behind them. Keep the mirror\u2019s surface characteristics consistent \u2014 the same slight tint, the same smudges and dust on the glass, the same edge softness. Her pose in the real world is unchanged; only the reflected phone disappears."),
        p("Remove Signage & Text", "Remove the readable text, branding and signage from the background surfaces, replacing them with plain continuation of the underlying material \u2014 blank wall, unprinted awning, empty storefront glass. Preserve the surfaces\u2019 texture, weathering, lighting and perspective. Subject unchanged."),
        p("Remove the Strap / Seam", "Remove the visible bra strap on her left shoulder, reconstructing the skin and the shoulder line beneath it with correct anatomy, lighting and skin texture continuous with the surrounding area. Do not change the garment, her pose or anything else."),
        p("Remove Sunburn / Redness", "Reduce the pronounced sunburn redness on her shoulders, chest and nose by roughly eighty percent, returning those areas to a tone consistent with the rest of her skin while leaving the faintest warmth so it does not look masked. Preserve all skin texture and pore detail. No other changes."),
        p("Remove Duplicate Artifacts", "Find and correct the generation artifacts in this image: any duplicated or malformed limb, merged fingers, an incorrect number of digits, a strap that terminates in nothing, an earring appearing on only one side, hair that passes through a solid object, or a background element that repeats unnaturally. Correct each one anatomically and physically while preserving the overall composition, lighting and grade.", "", "Run this as a routine second pass on every generation. It catches things you have stopped noticing.")
      ]},
      { id: "g-2-9", title: "2.9 Realism Repair \u2014 Making It Stop Looking AI", items: [
        p("The De-AI Pass", "Degrade this image toward the quality of an ordinary photograph taken by a person on an ordinary day. Break the perfect symmetry of the face and pose \u2014 one eye very slightly different from the other, the smile marginally uneven, the shoulders not level. Introduce imperfect focus: the eyes sharp but the ears and the tip of the nose falling off slightly, and a hair of motion softness in the hands. Add sensor noise, heavier in the shadows and in the blue channel. Reduce the overall micro-contrast that makes AI images look over-processed, and pull the saturation back about fifteen percent. Add one small mundane flaw to the environment \u2014 a scuff on the wall, a crooked object, a piece of litter. Let the horizon sit about one degree off level. Preserve the subject\u2019s identity, wardrobe, pose, location and lighting exactly.", "THE MOST USEFUL PROMPT IN THIS DOCUMENT"),
        p("Add Grain", "Add photographic grain matched to a moderately high ISO digital capture: fine luminance noise across the entire frame, noticeably heavier in the shadow regions and nearly absent in the brightest highlights, with a small amount of chroma noise producing faint color speckle in the darkest areas. The grain should sit on top of the image rather than replacing detail. No other changes."),
        p("Add Motion Blur", "Add motion blur consistent with a shutter speed of roughly one-fortieth of a second. Her hand and the hair moving fastest smear slightly in the direction of travel, while her torso and face remain nearly sharp. The background carries a faint directional smear if the camera panned. Keep everything else \u2014 composition, lighting, color \u2014 the same. This must look like a real capture, not an applied filter."),
        p("Add Lens Flaws", "Add the optical imperfections of a real lens: gentle corner vignetting, mild barrel distortion increasing toward the frame edges, slight softness in the extreme corners, faint purple-and-green chromatic fringing on high-contrast edges, and a small amount of veiling flare lifting the black point in the region nearest the brightest light source. Subtle throughout \u2014 noticeable only on inspection."),
        p("Add Sweat & Shine", "Make her look like she has actually been outside in the heat. Add a light sheen across the forehead, temples, nose bridge and upper lip, a few small beads of sweat at the hairline, dampness in the baby hairs at her temples, a faint flush across the cheeks and chest, and the very slight compression marks fabric leaves on skin. Do not change facial structure, expression or wardrobe."),
        p("Add Environmental Evidence", "Add the physical evidence that she has actually been in this environment: fine sand adhering to her shins and the tops of her feet, a faint salt residue on her forearms, dried water spots on her sunglasses, windblown hair that has not been re-styled, and a slight sunburn line where a strap sat. Small, specific, and easy to miss.", "", "Nothing sells a location shot harder than the subject having been affected by it."),
        p("Break the Pose", "Make the pose less deliberate. Shift her weight onto one hip so the shoulders and pelvis tilt in opposition, let one arm hang without purpose rather than posed, turn her head a few degrees away from the camera axis, and catch her expression between two states rather than at a peak. The body should look like it is passing through this position, not holding it."),
        p("Compression Artifacts", "Apply the degradation of an image that has been uploaded, compressed, downloaded and re-uploaded: mild JPEG blocking in flat areas of sky and wall, slightly smeared detail around high-contrast edges, faint banding in smooth gradients, and a small overall loss of sharpness. Do not change any content.")
      ]},
      { id: "g-2-10", title: "2.10 Finishing & Consistency Passes", items: [
        p("Face Refinement Pass", "Refine the facial detail only. Sharpen the eyes, restore individual eyelashes, resolve the iris texture, recover pore structure across the nose and cheeks, and correct any softness or asymmetry that is not deliberate. Maintain the exact facial structure, proportions, expression and identity. Keep everything outside the face untouched.", "ROUND 2 OF 4"),
        p("Local Fix Pass", "Fix only the [SPECIFIC ELEMENT: left hand / necklace clasp / shoe / hair edge against the sky]. Correct its anatomy or structure, match its lighting and grain to the surrounding area, and blend its edges seamlessly. Do not touch the face, the pose, the wardrobe, the background or the grade.", "ROUND 3 OF 4"),
        p("Upscale with Detail", "Upscale this image to four times its resolution, generating genuine new detail rather than interpolating existing pixels. Resolve individual hair strands, fabric weave, pore structure and iris fibers at the new scale. Scale the existing grain proportionally so it does not become blocky or disappear. Preserve identity, composition, color and lighting exactly.", "ROUND 4 OF 4"),
        p("Series Match", "Adjust this image so it belongs to the same shoot as the reference image. Match the color grade, contrast, white balance, grain structure, apparent lens character and level of sharpening. Do not change composition, subject, pose or content \u2014 treat this as a colorist matching two frames from the same roll."),
        p("Continuity Audit", "Compare this image to the reference and correct any continuity errors in the subject: hair length and part, jewelry present and on which side, nail color and length, tattoo placement and orientation, garment details, and any distinguishing marks. Every one of these must match the reference exactly. Do not change the pose, the location, the lighting or the framing of this image.", "", "Run before publishing anything that is supposed to be from the same day as a previous post.")
      ]}
    ]
  },
  {
    id: "s03", num: "03", title: "Tattoo Control",
    summary: "Full and partial removal, plus anatomically correct re-placement \u2014 how ink wraps, foreshortens and distorts on every body region. 24 prompts + placement tables.",
    groups: [
      { id: "g-3-1", title: "3.1 Why Tattoos Break", items: [
        prose("A tattoo is not an image placed on a surface. It is pigment suspended in the dermis: it sits under the specular layer, it obeys the surface geometry, it shows skin texture through it, and it ages (healed ink is blue-black or soft gray, not pure black)."),
        block("Ink Physics Block", "Render the tattoo as pigment held within the skin rather than an image applied on top of it. Skin texture, pores, fine hair and any freckles remain visible across the inked area. Healed ink reads soft blue-black or gray-black rather than pure black, with fine lines slightly thickened and softened by healing. The tattoo receives the scene's lighting exactly as the surrounding skin does, and any specular sheen, sweat or reflected light sits above the ink, not beneath it. Ink darkens in shadow and lightens under direct light in step with the skin around it. Edges are marginally soft, not vector-crisp.", "APPEND TO ANY TATTOO PROMPT")
      ]},
      { id: "g-3-2", title: "3.2 Removal", items: [
        p("Full Removal \u2014 Master Prompt", "Remove every tattoo from the subject\u2019s body so that no trace of ink remains anywhere on the skin. Reconstruct each cleared area as continuous natural skin that matches its immediate surroundings in tone, undertone, saturation and texture. Rebuild anatomically correct detail across the reconstructed regions: pore structure at the correct density for that body area, fine vellus hair, the natural tonal gradient across the muscle form beneath, subtle veining, and any freckles or moles continuing their existing distribution pattern. Reproduce the exact lighting behavior of the region \u2014 the same highlight placement on the raised surfaces, the same shadow in the recessed areas, the same reflected bounce. The cleared skin must show the same grain and noise level as the rest of the image. There must be no smoothing, no blur patch, no waxy or plastic area, no visible edge or seam, and no ghost or discoloration where the ink used to be. Do not change her pose, body proportions, muscle definition, face, hair, wardrobe, background, lighting or the framing of the image."),
        p("Remove One Specific Tattoo", "Remove only the tattoo on her [BODY REGION], leaving every other tattoo on her body completely intact and unchanged. Rebuild that area as continuous skin matching the surrounding tone, texture, pore density and lighting, with no seam and no residual shadow of the removed design. All other ink stays exactly where it is, at the same size, orientation and opacity."),
        p("Fade, Don\u2019t Delete", "Reduce the opacity of the tattoo on her [REGION] to roughly twenty-five percent of its current strength, as though it had been through several laser removal sessions. The design remains faintly readable as a soft blue-gray shadow under the skin, with the fine lines dissolving first and the heaviest solid areas persisting longest. Add a very slight overall lightening and a barely perceptible textural difference in the treated area. Everything else unchanged."),
        p("Removal on a Curved Surface", "Remove the tattoo wrapping around her [forearm / bicep / calf]. Because the surface is cylindrical, the reconstructed skin must carry the correct tonal gradient across the curve \u2014 brightest along the ridge facing the light source, falling off progressively toward both silhouette edges, with a subtle reflected bounce lifting the far edge. Pore visibility decreases toward the edges as the surface turns away from camera. No flat patch, no uniform tone. Nothing else changes.", "", "Most removal failures happen here. The model clears the ink and leaves a flat cylinder with no shading."),
        p("Removal in Low Light", "Remove the tattoo from her [REGION] in this dimly lit frame. The reconstructed skin must carry the same elevated noise, reduced saturation and compressed tonal range as the surrounding shadow areas \u2014 do not render it cleaner or brighter than its neighborhood. Match the existing chroma noise pattern. No bright patch, no smoothing."),
        p("Removal Under Motion Blur", "Remove the tattoo from her moving [arm / leg]. The reconstructed skin must inherit the same directional motion smear present in that region, at the same intensity and along the same axis. It should not be sharper than the limb it belongs to. Everything else unchanged."),
        p("Removal from a Reflection", "Remove the tattoo from both the subject and its appearance in the mirror reflection. The reflected version must be cleared in a way that stays geometrically consistent with the reflection \u2014 laterally inverted, dimmer, lower in contrast, and softened by the glass. Reconstruct skin in both places with matching tone and texture appropriate to each. No other changes."),
        p("Remove Freshness Artifacts", "Remove the signs that this tattoo is new: the redness and inflammation in the surrounding skin, the slight raised swelling along the linework, the sheen of ointment, and any peeling or scabbing. Leave the tattoo itself in place but render it as fully healed \u2014 settled into the skin, marginally softened, with the surrounding skin returned to its normal tone and texture.")
      ]},
      { id: "g-3-3", title: "3.3 The Anatomical Placement Reference", items: [
        prose("To re-state a tattoo\u2019s placement correctly, you have to tell the model what the surface underneath it is doing. Find the region, then paste its surface behavior language into the master prompt."),
        table(["Region", "Surface geometry", "How the ink must behave", "Visibility rules"], [
          ["Inner forearm", "Nearly flat, gently convex, long axis wrist to elbow", "Design runs parallel to the limb axis; minimal distortion; slight compression near the wrist", "Fully visible palm-up; disappears when the arm rotates palm-down"],
          ["Outer forearm", "Cylindrical with a pronounced wrap; the ulnar ridge is a hard edge", "Progressive horizontal compression toward both edges; the far side vanishes over the curve", "Rotates in and out of view with wrist position"],
          ["Wrist", "Small-radius cylinder, bony, tendon ridges", "A band wraps and disappears within ~40\u00b0 of arc; linework bends over the radial styloid", "Broken by the wrist crease; partly hidden by a watch or sleeve"],
          ["Bicep / outer upper arm", "Convex barrel with a shifting muscle belly", "Stretches and widens when flexed, bunches when relaxed; wraps steeply at the outer edge", "Occluded by any sleeve; fully visible only near-perpendicular"],
          ["Deltoid / shoulder cap", "Compound dome \u2014 curves in two axes", "Radiates over the dome with radial distortion; outer edges compress in both directions", "Shifts with arm elevation; a raised arm rotates the design forward"],
          ["Inner bicep", "Soft, flat, low-tension", "Very little distortion; reads almost as printed", "Hidden with the arm down; visible arm-raised"],
          ["Collarbone", "Follows the S-curve of the clavicle; thin skin over bone", "Traces the bone\u2019s sweep, rising toward the shoulder; sharp highlight along the ridge", "Framed by a neckline; hidden by hair forward"],
          ["Sternum / centre chest", "Concave valley between the ribs, symmetric", "Symmetrical designs mirror precisely about the midline; centre recedes into shadow", "Expands with breathing; deforms leaning forward"],
          ["Ribcage / side", "Barrel curve running diagonally down and forward", "Compresses toward the back; stretches on a side-bend away, gathers on a side-bend toward", "Visible with arm raised; usually partly occluded"],
          ["Spine", "Follows the vertebral groove with lumbar/thoracic curves", "Sits centred in the groove, curving with the spine; distorts on any twist", "Broken by hair, straps, and the groove shadow"],
          ["Shoulder blade", "Flat plate that slides across the ribcage", "Translates and rotates with arm position; the scapular ridge casts a shadow", "Reaching forward wings the blade and warps the design"],
          ["Nape of neck", "Tight convex curve at the base of the skull", "Strong vertical foreshortening; the top compresses as the surface turns away", "Usually partly under the hairline; visible only hair-up"],
          ["Behind the ear", "Very small radius, complex folded geometry", "Anything over ~1 inch bends around the mastoid; fine detail lost to the curve", "Revealed only on a head turn or with hair tucked"],
          ["Hand & fingers", "Segmented; skin creases at every joint", "Lines break and shift at each knuckle crease; distorts completely when the hand closes", "Ages fastest \u2014 the softest, most blown-out ink"],
          ["Hip / iliac crest", "Angled bony ridge sloping down and forward", "Follows the diagonal of the crest, not the horizontal; compresses when seated", "Mostly under a waistband; visible only at angles"],
          ["Thigh", "Large tapered cylinder, the flattest big canvas", "Minimal distortion standing; flattens and widens when seated with weight on it", "Front visible standing; outer thigh only in profile"],
          ["Calf", "Teardrop \u2014 widest at the upper third", "Follows the taper; wraps hard at the edges; changes with the foot pointed/flexed", "Rear calf hidden entirely from the front"],
          ["Ankle", "Bony, irregular, malleolus on both sides", "Deforms around the ankle bones rather than passing over evenly; tension varies", "Broken by socks and shoe lines; partly in ground shadow"],
          ["Foot / top", "Domed over the metatarsals with tendon ridges", "Arches over the dome and drops away at the sides; tendons create raised ridges", "Visible only barefoot or in an open sandal"]
        ])
      ]},
      { id: "g-3-4", title: "3.4 The Master Placement Re-Statement", items: [
