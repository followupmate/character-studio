        block("Re-State the Tattoo Anatomically", "Re-render the tattoo currently on the subject\u2019s [REGION] so that it sits on the body with correct anatomy. Keep the design, its size, its orientation and its exact position identical to the reference \u2014 this is a correction of how it wraps and lights, not a relocation. The underlying surface is [SURFACE GEOMETRY FROM THE TABLE], so the design must [SURFACE BEHAVIOR FROM THE TABLE]: its horizontal spacing compresses as the surface curves away, its vertical proportions foreshorten with the viewing angle, and any portion crossing beyond the silhouette edge disappears entirely rather than being drawn flat against the outline. Straight lines within the design bend to follow the contour. The ink stretches where the skin is under tension and gathers where the skin folds. Where a crease, joint, tendon ridge or bone protrusion crosses the design, the linework breaks, bends or shifts across it. Lighting on the tattoo matches the skin immediately around it, with any specular sheen sitting above the ink. Skin texture, pores, fine hair and freckles remain visible through and around the ink. Do not change the design itself, the pose, her body, face, wardrobe, background or lighting.", "FILL IN THE BRACKETS FROM \u00a73.3"),
        block("Tattoo Continuity Lock", "The subject\u2019s tattoos must match the reference image exactly in every respect: the same designs, on the same limbs, on the same side of the body, at the same scale relative to her anatomy, at the same rotation relative to the limb axis, and with the same ink density and healing state. No tattoo may be added, removed, resized, mirrored or moved to a different body region. Any tattoo that would be occluded by clothing, hair, body position or the frame edge in this pose is correctly hidden rather than drawn through the obstruction.", "PASTE INTO EVERY NEW GENERATION", "This one clause eliminates the majority of tattoo drift across a content set.")
      ]},
      { id: "g-3-5", title: "3.5 Placement by Region \u2014 Ready-to-Run", items: [
        p("Inner Forearm Script", "Place the fine-line script tattoo from the reference along the subject\u2019s inner left forearm, running lengthwise from just below the elbow crease toward the wrist, following the limb\u2019s long axis. The baseline of the text curves gently with the natural convexity of the forearm rather than running perfectly straight. Letter spacing compresses slightly toward the wrist as the limb narrows, and the ends closest to the silhouette edges begin to turn away and foreshorten. When the arm rotates palm-down, the script would rotate out of view \u2014 in this pose it is [fully visible / partially rotated away]. Fine-line healed ink: soft gray-black, lines slightly thickened, skin texture visible through it."),
        p("Outer Forearm Wrap", "Render the tattoo wrapping the subject\u2019s outer right forearm as a design on a cylinder. The central portion facing camera shows its full width and correct proportions; moving outward in both directions the horizontal spacing compresses progressively, and past roughly seventy degrees of arc the design disappears over the silhouette edge entirely. Do not flatten the far side against the outline. The ulnar ridge creates a subtle raised line that the ink crosses over, with a corresponding highlight on the ridge and slight shadow beside it. Ink is fully healed and receives the scene lighting identically to the surrounding skin."),
        p("Deltoid Cap", "Place the tattoo over the subject\u2019s left deltoid as a design on a compound dome. It must distort radially in two axes at once \u2014 compressing toward the outer edge of the shoulder, toward the front of the arm and toward the top of the cap simultaneously. The apex of the shoulder catches the brightest highlight and that highlight passes over the ink. Because her arm is [raised / at her side], the whole design has rotated [forward and up / down and back] accordingly. The deltoid\u2019s muscle form creates tonal gradation across the design."),
        p("Collarbone", "Place the tattoo along the subject\u2019s right clavicle. The design follows the bone\u2019s natural S-curve \u2014 dipping slightly near the sternum, rising as it travels laterally toward the shoulder. The skin here is thin and directly over bone, so a bright specular highlight runs along the clavicle ridge and passes across the ink, with a soft shadow in the hollow above it. The design foreshortens as it travels toward the shoulder and turns away from camera. Where her neckline crosses, the tattoo is cleanly occluded by fabric rather than showing through."),
        p("Ribcage / Side Body", "Place the tattoo on the subject\u2019s left ribcage, running diagonally down and forward along the direction of the ribs. Because she has her arm raised, the skin here is under tension and the design is stretched vertically by roughly ten percent compared to its relaxed proportions. The barrel curve of the ribcage compresses the design horizontally toward her back, where it disappears over the silhouette. The individual rib contours create a subtle repeating undulation of highlight and shadow that crosses the ink. Any portion below her arm is in soft shadow and the ink reads darker and lower in contrast there."),
        p("Spine", "Place the vertical tattoo down the centre of the subject\u2019s back, seated in the vertebral groove. It follows the natural curvature of her spine in this pose rather than running dead straight \u2014 curving with the thoracic and lumbar bends. The groove itself sits in a soft shadow that runs down the centre of the design, with the paraspinal muscles catching light on either side. Because she is [standing straight / twisting / arched], the design [runs true / skews and compresses on the compressed side]. Where her hair falls across her back, the tattoo is occluded."),
        p("Shoulder Blade", "Place the tattoo across the subject\u2019s right scapula. Because her arm is reaching forward, the shoulder blade has protracted and rotated outward \u2014 the entire design translates laterally and rotates with it, and the raised scapular ridge casts a shadow across the design. The skin over the blade is stretched, widening the design slightly. Its outer edge wraps toward the side of the ribcage and compresses."),
        p("Sternum / Underbust", "Place the symmetrical tattoo centered on the subject\u2019s sternum. Its axis of symmetry must align exactly with her body midline, and the two halves must mirror each other precisely across it. The sternal valley is recessed, so the centre of the design sits in soft shadow while the flanks catch more light. Her chest is [expanded on an inhale / relaxed], so the design is [slightly widened / at its neutral width]. Where a neckline crosses, the design is cleanly cut off by fabric."),
        p("Nape of Neck", "Place the small tattoo at the nape of the subject\u2019s neck, centered below the occipital bone. Because the surface curves away sharply from camera at this angle, the design foreshortens strongly \u2014 its vertical dimension compresses to roughly half its true proportion. The lower portion is partly obscured by the collar of her top and by fine baby hairs at the hairline. Above it, her hair is [up / tucked to one side] so the design is visible."),
        p("Hand & Fingers", "Place the small tattoos on the subject\u2019s hand: one on the outer edge of the index finger and one in the web between thumb and forefinger. Because her hand is [open and relaxed / closed around an object], the linework [runs cleanly / breaks and shifts at the knuckle creases]. Hand ink is the softest on the body \u2014 render these noticeably blurred and blown out at the edges, gray rather than black, with fine lines partly dissolved. The knuckle creases and the tendon ridges on the back of the hand cross over the ink."),
        p("Thigh \u2014 Seated", "Place the tattoo on the subject\u2019s outer right thigh. She is seated with her weight on that leg, so the thigh has flattened and spread against the surface \u2014 the design widens horizontally by roughly fifteen percent and its lower edge compresses where the flesh meets the seat. The upper surface catches light while the outer edge turns away and darkens. Where the hem of her shorts crosses, the design is cleanly occluded."),
        p("Ankle Band", "Place the band tattoo around the subject\u2019s left ankle, just above the malleolus. It does not pass over the ankle bones evenly \u2014 it rides above the medial bump and deforms around the lateral one, and the spacing within the band varies with the changing circumference. The visible arc covers roughly a third of the ankle\u2019s circumference; the remainder disappears around the back. Ground bounce lights the underside of the ankle faintly, and the whole area sits slightly in her own shadow.")
      ]},
      { id: "g-3-6", title: "3.6 Mirrors, Flips & Additions", items: [
        p("Mirror Selfie Correction", "This is a mirror selfie, so the reflection is laterally inverted. Correct the tattoos accordingly: any tattoo on her physical right side must appear on the left side of the reflected image, and vice versa. Any asymmetric design must appear mirrored. Any text within a tattoo must read backwards in the reflection. The tattoos on her actual body, where visible outside the mirror, remain correctly oriented. Apply the same inversion logic to her hair part, any text on her clothing, and which hand is holding the phone.", "CRITICAL", "Nearly every AI mirror selfie gets this wrong. It is the fastest way for an observant follower to catch you."),
        p("Add a New Tattoo Correctly", "Add a [DESIGN DESCRIPTION] tattoo to the subject\u2019s [REGION], sized so that it spans approximately [X] centimetres on her body \u2014 scale it against the visible anatomy in frame rather than against the image dimensions. Orient it so that its long axis runs [along the limb / with the bone / vertically with the body]. Apply the full anatomical wrap, foreshortening and lighting behavior for that region. Render it as healed rather than fresh. Nothing else in the image changes."),
        p("Move a Tattoo", "Move the tattoo currently on her [ORIGIN REGION] to her [DESTINATION REGION]. Fully reconstruct clean skin at the origin with correct tone, texture and lighting. At the destination, re-render the design according to that region\u2019s surface geometry \u2014 it must wrap, foreshorten and light correctly for the new location, which means its apparent shape will differ from how it looked in the original position. Do not simply paste the same flat shape in a new place."),
        p("Age a Tattoo", "Render this tattoo as though it were fifteen years old. Fine lines have blurred and spread slightly into the surrounding dermis, black has faded toward blue-gray, any color has desaturated with the reds fading most, edges are noticeably soft, and the smallest details have partly closed up and lost definition. The design remains recognizable but nothing about it is crisp. Surrounding skin is unchanged."),
        p("Fresh Tattoo", "Render this tattoo as three days old. The linework is dense, saturated and crisp. The surrounding skin within about a centimetre of the ink is slightly pink and mildly raised, with a subtle swelling that catches light along the heaviest lines. There is a faint sheen from ointment. Very light peeling has begun at the edges of the solid areas. Nothing else changes."),
        p("Partial Occlusion Audit", "Check every tattoo in this image against the pose and correct any that are drawn through an obstruction. Ink beneath fabric, beneath hair, on a limb turned away from camera, or outside the frame must be genuinely hidden rather than rendered through the obstruction or flattened against a silhouette edge. Where a design is partially occluded, the visible portion must remain correctly proportioned to the hidden part. No other changes.")
      ]}
    ]
  },
  {
    id: "s04", num: "04", title: "The San Diego & SoCal Location Bible",
    summary: "76 location prompts from La Jolla to Joshua Tree, plus the unglamorous everyday spots that make a feed feel real. Each assumes \u201cthe woman from the reference image\u201d at the front and the Realism Tail (\u00a70.6) at the back.",
    groups: [
      { id: "g-4-0", title: "How to use this section", items: [
        prose("Every prompt here assumes \u201cthe woman from the reference image, identity preserved exactly\u201d at the front and the Realism Tail (\u00a70.6) at the back \u2014 written to be run as-is with a reference attached. Two things separate a good location shot from a great one. First, time of day is not decoration: San Diego\u2019s marine layer burns off around 11am and the light goes gold from about 6:30pm in summer. Second, she has to have been affected by the place \u2014 wind in the hair, sand on the shins, squint lines in the sun.")
      ]},
      { id: "g-4-1", title: "4.1 La Jolla & the North Coast", items: [
        p("01 Â· La Jolla Cove, Morning", "Standing on the grass bluff above La Jolla Cove at 8am with the marine layer still hanging low over the water and the light flat and silver. Sea lions barely visible on the rocks below, out of focus. Oversized crewneck sweatshirt over bike shorts, hair in a claw clip with strands escaping, holding an iced coffee sweating in the humidity. Turned three-quarters away from camera looking out at the water, caught mid-turn back. iPhone main camera, 24mm, eye level, 4:5."),
        p("02 Â· Scripps Pier at Sunset", "Standing on the wet sand at Scripps Pier as the tide pulls out, the pier\u2019s pilings receding in a perfect line toward the horizon and the sun sitting low between them. Backlit hard \u2014 nearly a silhouette with a blown rim of gold along her hair and shoulders, face lifted only by sand bounce. Linen shirt open over a swimsuit, jeans rolled to the knee, shoes in one hand. Mid-walk toward camera, looking down at the water around her ankles. 85mm at f/1.8, heavy flare across the lower frame."),
        p("03 Â· Windansea Shack", "Sitting on the sand in front of the surf shack at Windansea, late afternoon, the palm-frond roof throwing striped shadow across her. Wetsuit peeled to the waist over a swimsuit, hair wet and clumped, salt drying white on her forearms. Knees pulled up, forearms resting on them, squinting slightly toward something off camera to her left. Shot slightly from below at sand level on a 35mm. Warm film grade."),
        p("04 Â· Torrey Pines, the Broken Hill Trail", "Mid-hike on the sandstone trail at Torrey Pines, 9:30am, the eroded orange bluffs rising behind her and a sliver of ocean visible far below. Running shorts, a cropped tank, a windbreaker tied around her waist, trail dust on her calves. Caught mid-stride, one hand pushing hair off her face, genuinely out of breath rather than posed. Shot from behind and slightly ahead on a 50mm, so the trail leads into frame."),
        p("05 Â· Black\u2019s Beach from the Bluff", "Sitting on the edge of the sandstone bluff above Black\u2019s Beach at golden hour with her legs dangling, the beach an enormous empty crescent far below and paragliders as tiny specks in the sky. Sun low and directly behind her. Vintage-wash denim shorts and a thrifted band tee, hair whipping sideways in the onshore wind. Wide shot on a 24mm where she occupies maybe an eighth of the frame \u2014 the scale is the point."),
        p("06 Â· La Jolla Shores Parking Lot", "Leaning against the open tailgate of a sun-faded SUV in the La Jolla Shores lot at 7am, wetsuit half on with the arms hanging, board leaning against the bumper, thermos in hand. Fog. The light is cold and blue and completely unflattering. She is not looking at the camera, she is looking at the surf. Digicam CCD look with the flash off \u2014 grainy, cool, slightly soft."),
        p("07 Â· Mount Soledad", "At the top of Mount Soledad at blue hour, the entire city grid spread out below with the lights just coming on and a band of orange still on the western horizon. Sitting on the low wall with her back to the view, turned to look over her shoulder at the camera. Hoodie over a slip dress, sneakers. Night mode \u2014 lifted shadows, visible grain, streetlights blooming, one degree of handheld softness."),
        p("08 Â· La Jolla Sea Caves Kayak", "Sitting in a bright yellow tandem kayak on flat green water outside the sea caves, cliff face rising directly behind her with cormorants on the ledges. Bright midday sun overhead, hard reflections dancing on the water. Rash guard, sunglasses pushed up on her head, paddle across her lap, laughing at something out of frame. Shot from the second kayak on an action camera \u2014 ultra wide, water droplets on the lens, distorted horizon.")
      ]},
      { id: "g-4-2", title: "4.2 PB, Mission Bay, OB & Point Loma", items: [
        p("09 Â· Pacific Beach Boardwalk", "Walking the PB boardwalk at 5pm on a Saturday, palm trees and low apartment buildings on one side, sand and volleyball nets on the other, a blurred cyclist passing behind her. Cropped baby tee, low-slung cargo pants, chunky sneakers, tote bag on one shoulder. Mid-stride, mid-laugh, looking off to her right. Shot from a moving position slightly ahead of her on a 35mm with a touch of motion blur in the background."),
        p("10 Â· Crystal Pier", "Standing on the wooden planks of Crystal Pier between the little white cottages, late afternoon, the boards weathered gray and the ocean visible through the gaps beneath her feet. Wind hard off the water. White linen set, hair completely out of control. Holding her hair back with one hand and failing. 24mm from low, the cottage roofline converging behind her, 4:5."),
        p("11 Â· Mission Bay, Golden Hour Picnic", "Sitting cross-legged on a striped towel on the grass at Mission Bay with the flat calm water behind her and Mission Beach\u2019s rollercoaster tiny in the distance. Golden hour, warm and hazy. Snacks and an open bag of chips beside her, a small speaker, a dog leash but no dog in frame. Mid-conversation with someone off camera, not looking at the lens. 50mm, shot from someone else\u2019s eye level sitting on the grass."),
        p("12 Â· Belmont Park at Night", "Standing under the lights of the Giant Dipper at Belmont Park after dark, the white wooden coaster structure lit and looming behind her, arcade neon spilling across the frame. Direct flash fired straight at her \u2014 skin slightly overexposed, background dropping to black beyond eight feet, colors punchy and wrong. Denim jacket over a going-out top, small bag. Caught blinking. Deliberately unflattering and completely of the moment."),
        p("13 Â· Ocean Beach Pier", "Walking out on the OB pier on an overcast morning, the concrete railing scarred and salt-stained, fishermen with buckets blurred in the background. Flat gray light, no shadows. Oversized flannel over a tank, sweats, socks with slides. Hands in pockets, shoulders up, cold. Shot from behind at 35mm as she walks away, then turning her head back toward camera. Muted desaturated grade."),
        p("14 Â· OB Dog Beach", "Crouched down on the wet sand at Dog Beach with a soaked golden retriever shaking off beside her, spray frozen mid-air. Late afternoon, low sun from behind camera-left lighting the droplets. Rolled-up sweatpants, bare feet, sand to the knees, sunglasses on top of her head. Laughing with her eyes closed and her face turned away from the shake. Fast shutter, 50mm, absolutely candid."),
        p("15 Â· Sunset Cliffs", "Sitting on the sandstone at Sunset Cliffs about twenty minutes before the sun hits the water, the ocean a wide band of hammered gold and the cliff edge dropping away in front of her. Ice plant in the foreground. Long knit cardigan over shorts, bare feet, hair backlit into a glowing halo. Knees up, arms wrapped around them, looking out. Wide 24mm from behind and to the side so the horizon dominates. Heavy flare, lifted blacks."),
        p("16 Â· Sunset Cliffs Cave", "Standing inside the arch of the sea cave at Sunset Cliffs, framed by dark wet rock with a bright rectangle of ocean and sky behind her. Extreme contrast \u2014 mostly in shadow with a hard rim of light on one side. Swimsuit under an unbuttoned shirt, wet hair. Leaning against the rock with one hand. Exposed for her face so the opening blows out completely. 35mm, high contrast, deep shadows with visible noise."),
        p("17 Â· Point Loma / Cabrillo Tidepools", "Crouched at the tidepools below Cabrillo at low tide, peering into a pool with anemones and a hermit crab visible in the clear water, dark wet basalt everywhere, the ocean flat behind her. Overcast midday. Leggings pushed up over her knees, water shoes, windbreaker. Absorbed in the pool, not aware of the camera. Shot from above and behind at 35mm so the pool and her reflection are both in frame.")
      ]},
      { id: "g-4-3", title: "4.3 Downtown, Little Italy, Barrio Logan & Coronado", items: [
        p("18 Â· Little Italy Saturday Market", "Moving through the Little Italy farmers market at 10am, canvas awnings overhead throwing dappled shade, crates of stone fruit and flower buckets crowding the frame. Warm sun in patches. Linen shorts, a cropped knit, a canvas tote with a bunch of eucalyptus sticking out of it, sunglasses. Mid-reach for a peach, half-turned, mouth open mid-sentence to a vendor out of frame. 35mm at f/2, shallow enough that the crowd behind melts."),
        p("19 Â· Little Italy Piazza Fountain", "Sitting on the edge of the piazza fountain in Little Italy in the late afternoon, string lights strung overhead not yet on, restaurant patios filling up around her. Slip skirt, ribbed tank, a cardigan slipping off one shoulder, gold hoops. Legs crossed, leaning back on both hands, head tipped up toward the last of the sun with her eyes closed. 50mm from across the piazza, people passing softly out of focus in the foreground."),
        p("20 Â· Barrio Logan Murals", "Standing in front of a saturated Chicano Park mural at the base of a bridge pylon, the painting enormous behind her in deep reds, blues and golds. Midday sun bouncing off the concrete. Baggy jeans, a white tank, a flannel tied at the waist, gold chain. Standing casually with her weight on one hip, arms loose, looking off to the side rather than posing against the wall. 35mm from slightly below so the pylon towers. High saturation but controlled.", "", "Treat the murals as a place, not a backdrop \u2014 frame her as a person standing in a neighborhood."),
        p("21 Â· Gaslamp at Night", "Standing on a Gaslamp sidewalk at 11pm, neon signage and string lights above, wet pavement from a hose-down reflecting red and gold, blurred figures moving past. Direct flash from a phone \u2014 harsh, immediate, background falling to black beyond her. Going-out dress, small shoulder bag, hair down. Caught mid-step and mid-laugh, slightly out of focus. Motion blur on a passing car behind her."),
        p("22 Â· Downtown Rooftop", "On a downtown rooftop bar at blue hour, glass railing, the skyline lit behind her, a low string of bulbs overhead. Turned toward the view with a drink resting on the railing, looking back over her shoulder. Warm practical light on her face from the bulbs, cool blue ambient on everything else. Satin top, wide-leg trousers. 50mm at f/1.8 \u2014 the city bokehs into a field of soft orange discs."),
        p("23 Â· Coronado Ferry Landing", "Standing at the Coronado ferry landing with the downtown skyline directly across the bay, late afternoon, the water choppy and glittering. Wind. Long linen dress pressing against her legs, hair sideways, holding a straw hat down with one hand. Half-laughing at the wind. 35mm from a low angle, the bridge visible as a thin arc in the background. Warm film grade with lifted shadows."),
        p("24 Â· Hotel Del Beach", "Walking on the wide flat sand in front of the Hotel del Coronado at sunset, the red turrets small in the background, the sand almost white and mirror-wet from the retreating tide, reflecting the whole sky. Long shadow stretching toward camera. White cotton dress, hair loose, shoes hanging from two fingers. Mid-stride, looking down at the reflection. 85mm from a distance so she is small in a huge frame."),
        p("25 Â· Coronado Beach Cruiser", "Standing over a pale blue beach cruiser on the Coronado bike path at 8am, palm shadows striping the pavement, the marine layer just breaking. Cropped hoodie, bike shorts, ankle socks, a basket with a towel and a water bottle. One foot down, hands on the bars, looking down the path away from camera. 35mm from ahead and low so the path leads out behind her."),
        p("26 Â· Embarcadero Morning Run", "Mid-run along the Embarcadero at 6:45am, the bay flat and pink, the Midway\u2019s silhouette behind her, joggers and a few tents blurred in the distance. Cold blue-pink light. Running set, cap, wired-look earbuds, wrist watch. Genuinely mid-stride with correct running mechanics, flushed, hair in a high pony swinging. 70\u2013200 at 135mm from far ahead, heavily compressed, shot as if she does not know.")
      ]},
      { id: "g-4-4", title: "4.4 North Park, South Park, Hillcrest & the Neighborhoods", items: [
        p("27 Â· North Park Coffee Shop Window", "Sitting at a window counter in a North Park coffee shop mid-morning, big soft window light from camera-right, plants on the sill, a laptop half-open, a ceramic cup with latte art gone slightly wrong. Baggy vintage tee, hair clipped up, glasses. Chin in hand, looking out the window at the street, not at the camera. 50mm at f/2, warm neutral grade, soft falloff into the room behind her."),
        p("28 Â· North Park Alley Mural", "Standing in a North Park alley beside a hand-painted mural, mid-afternoon with hard sun cutting a diagonal across the wall and half her body in shadow. Dumpster and power lines deliberately left in frame. Thrifted leather jacket, baggy jeans, sunglasses. Leaning one shoulder against the wall, unbothered. 35mm, high-contrast, slightly desaturated. The mess is the aesthetic."),
        p("29 Â· University Heights Sign", "Standing under the neon University Heights arch at dusk, the sign just lit and glowing pink and blue against a deep indigo sky, cars passing with light trails. Vintage cardigan over a slip, sneakers. Looking up at the sign rather than at the camera. Handheld at a slow shutter so the traffic streaks and she is nearly sharp. Tungsten-film halation glow on every light."),
        p("30 Â· South Park Craftsman Porch", "Sitting on the wooden steps of a Craftsman bungalow porch in South Park at 5pm, bougainvillea spilling over the railing, a cat asleep on the boards behind her, warm low sun coming through the plants and dappling everything. Sweats and a knit tank, bare feet, a mug. Elbows on knees, mid-yawn. 50mm at f/1.8 from the sidewalk below."),
        p("31 Â· Hillcrest Farmers Market", "In the crowded Hillcrest farmers market on a Sunday, sun through white canopy tents making everything glow, flowers and produce and a queue for pupusas behind her. Denim shorts, a crochet cardigan, tote on the shoulder, iced drink. Turned in profile, looking down at a bunch of dahlias she is holding. 35mm at f/2, people passing in front of the lens slightly blurred."),
        p("32 Â· Normal Heights Thrift Rack", "Inside a thrift store on Adams Avenue, harsh mixed fluorescent overhead light, dense racks of clothing crowding both sides of the frame. Flipping through hangers, head down, half-hidden between the racks, holding a leather jacket up against herself. Cargo pants and a tank. Shot from the end of the aisle on a 35mm with an unflattering green-cyan fluorescent cast left uncorrected."),
        p("33 Â· Balboa Park Lily Pond", "Standing at the edge of the lily pond in Balboa Park at 8:30am with the Botanical Building\u2019s wooden lath dome reflected in the still water behind her. Soft early light, no crowds yet. Long floral skirt, plain white tank, hair down. Turned away, looking at the reflection, one hand trailing near the water. 50mm at f/2.8. Cool clean grade, high detail."),
        p("34 Â· Balboa Park Colonnade", "Walking through the arched colonnade along El Prado in Balboa Park at 4pm, repeating stone arches receding into perspective, warm light pooling through each opening and striping the walkway. Long trench over a simple dress, boots. Mid-stride in and out of a light pool so half of her is lit and half is in shade. 35mm from down the corridor, symmetrical framing, one degree off level.")
      ]},
      { id: "g-4-5", title: "4.5 North County Coast", items: [
        p("35 Â· Encinitas Boathouses", "Standing on the sidewalk in front of the pale blue Encinitas boathouses on a bright weekday morning, the nautical rooflines and porthole windows filling the background, jacaranda petals scattered on the pavement. Vintage sundress, sneakers, canvas tote. Hands behind her back, weight on one leg, squinting into the sun with a small real smile. 35mm from across the street, mild compression, warm film grade."),
        p("36 Â· Swami\u2019s Overlook", "Leaning on the wooden railing at Swami\u2019s overlook watching the lineup below, mid-morning with the sun still low and the water silver and glassy. Dozens of surfers as tiny dark shapes. Zip hoodie over a swimsuit, hair in a bun, coffee cup on the railing. Both forearms on the rail, chin on her hands, watching. Shot from behind and to the side on a 50mm so her face is in profile and the ocean fills the rest."),
        p("37 Â· Self-Realization Gardens", "Sitting on a low stone bench in the meditation gardens above Swami\u2019s, koi pond and dense green planting behind her, filtered midday light through a canopy of trees, ocean visible as a blue strip between the leaves. Simple white linen set, hair down, no jewelry. Cross-legged, hands loose, eyes closed, genuinely still. 50mm at f/2, soft and quiet, muted grade."),
        p("38 Â· Cardiff Kook / 101", "Standing beside the surfer statue on Highway 101 in Cardiff at golden hour, the statue dressed in whatever nonsense it is dressed in this week, cars passing on the coast road, ocean beyond. Wind. Denim cutoffs, a vintage tee, socks and sneakers. Pointing at the statue and laughing at whoever is taking the photo. 35mm handheld, slightly crooked, mid-motion."),
        p("39 Â· Leucadia Eucalyptus Tunnel", "Standing in the middle of the eucalyptus-lined stretch of the 101 in Leucadia at 6pm, the tall trees arching overhead and the low sun blasting horizontally down the road, turning the whole corridor gold and hazy. Long shadow running straight toward camera. Flowing midi dress, hair backlit. Walking toward the lens with her arms out, unbothered. 85mm from far down the road, heavy compression and flare."),
        p("40 Â· Moonlight Beach Fire Pit", "Sitting on the sand at Moonlight Beach after sunset beside a fire pit, the flames the only significant light source, the sky a deep gradient of navy to rust on the horizon. Blanket around her shoulders over a hoodie, hair loose. Warm flickering light on one side of her face, cold blue ambient on the other. Looking into the fire, not at the camera. Night handheld at high ISO \u2014 heavy grain, deep shadows, warm highlights."),
        p("41 Â· Del Mar Bluffs Train", "Standing on the bluff trail above the tracks in Del Mar as a train passes below her, the ocean directly beyond it, late afternoon light warm and low. Motion blur on the train, sharp on her. Wide-leg jeans, a cropped cardigan, sunglasses. Facing the ocean with her back three-quarters to camera, hair blowing. 50mm, panned slightly with the train."),
        p("42 Â· Solana Beach Fletcher Cove Stairs", "Descending the long concrete stairs at Fletcher Cove, sandstone bluffs rising on both sides, ocean framed at the bottom of the flight, morning marine layer softening everything. Cover-up over a swimsuit, towel over one shoulder, flip flops. Halfway down, one hand on the rail, glancing back up toward camera. 35mm from the top of the stairs looking down, strong leading lines."),
        p("43 Â· Carlsbad Flower Fields", "Standing in the ranunculus rows in Carlsbad in early spring, endless stripes of saturated color running to the horizon and the ocean visible far beyond. Bright but slightly hazy midday. Simple pale dress against the loud color, hair down, straw hat in hand. Standing in the row facing camera, slightly self-conscious, half-smiling. 35mm at f/4 so the rows stay legible into the distance. Restrained saturation despite the subject.", "", "The instinct is to crank saturation here. Don\u2019t \u2014 the field is already screaming. Pulling color back is what makes it look shot rather than filtered."),
        p("44 Â· Oceanside Pier, Early", "Walking out onto the Oceanside pier at 6:30am, the long wooden deck stretching ahead into low fog, lamp posts still lit, a couple of fishermen far out. Cold flat blue light. Sweatpants, an oversized hoodie with the hood up, coffee. Hands in the pocket, shoulders up, walking away from camera down the deck. 35mm from behind, symmetrical, the fog swallowing the far end. Cool desaturated grade with visible grain."),
        p("45 Â· Oceanside Harbor", "Sitting on a bollard at Oceanside Harbor mid-afternoon, fishing boats and masts crowding the background, gulls, the smell of diesel implied. Bright hard sun. Boyfriend jeans, a striped long sleeve, sunglasses on. Eating fish and chips out of a paper basket, mid-bite, not remotely posed. 50mm from a few feet away, casual, slightly high angle.")
      ]},
      { id: "g-4-6", title: "4.6 Inland San Diego & Day Trips", items: [
        p("46 Â· Julian in Autumn", "Standing on the wooden boardwalk of Julian\u2019s main street on a cool October afternoon, false-front buildings and apple pie signage behind her, actual fall color in the trees, low golden light. Chunky knit sweater, jeans, boots, a pie box in both hands. Looking down at the box, laughing. 35mm, warm grade, a little smoke haze from a wood stove in the air."),
        p("47 Â· Anza-Borrego Wildflowers", "Standing in the desert floor of Anza-Borrego during a superbloom, low yellow and purple flowers carpeting the sand around her, bare eroded hills in the far distance, harsh clean high-desert light. White tank, loose linen pants, a bandana, boots. Arms out, spinning slowly, hair mid-motion. Wide 24mm from low so the flowers fill the foreground and the sky takes the top half. Very high dynamic range, deep blue sky."),
        p("48 Â· Anza-Borrego Sculptures at Dusk", "Standing beneath one of the giant rusted metal sculptures in Borrego Springs at last light, the enormous silhouette of the piece against a burning orange and violet sky, the desert flat and empty in every direction. She is small and dark in frame with a rim of dying light on her shoulder. Denim jacket, cowboy boots. Wide 24mm, mostly sky, tiny subject. Silhouette exposure."),
        p("49 Â· Desert Stars", "Sitting on the roof of a car in the Anza-Borrego desert well after dark, the Milky Way arcing across the whole frame above her, no light pollution at all. Lit only by a warm phone screen in her lap, a small pool of light on her face and hands. Blanket over a hoodie. Long exposure \u2014 stars sharp, her slightly soft from breathing. Heavy grain, cool blue with a warm point."),
        p("50 Â· Mount Laguna Pines", "Standing among the Jeffrey pines on Mount Laguna in the late afternoon, tall trunks receding into a warm dusty haze, pine needles thick on the ground, shafts of low light cutting between the trees. Flannel over a thermal, jeans, hiking boots. Hands in pockets, looking up into the canopy. 50mm at f/2, warm volumetric light, dust in the beams."),
        p("51 Â· Temecula Vineyard", "Standing at the end of a vine row in Temecula wine country at golden hour, the rows converging behind her, rolling brown hills beyond, warm dusty air. Wrap dress, sandals, a glass held loosely by the stem. Turned in profile, looking down the row. 85mm at f/1.8, heavy compression, the vines dissolving into warm bokeh, sun flaring from behind."),
        p("52 Â· Ramona Back Roads", "Sitting on the hood of a dusty older car pulled over on a two-lane road through the Ramona backcountry, dry gold grass and scattered oaks, big empty sky, late afternoon. Cutoffs, a tank, boots, sunglasses. Leaning back on her hands with her ankles crossed, looking off down the road. 35mm from the roadside, warm dusty grade, real heat haze on the asphalt.")
      ]},
      { id: "g-4-7", title: "4.7 Wider Southern California", items: [
        p("53 Â· San Clemente Pier", "Walking on the San Clemente pier at mid-morning, Spanish-tile roofs on the bluff behind, the Metrolink track running along the sand below, marine layer half burned off. Swim cover-up, tote, wet hair. Mid-stride, looking back over her shoulder. 35mm, cool-to-warm transitional light, soft film grade."),
        p("54 Â· Laguna \u2014 Treasure Island Tidepools", "Standing on the rocks at Treasure Island Beach in Laguna at low tide, turquoise water in the coves, palm-topped bluffs, bright clear midday light. Swimsuit under a gauzy shirt, hair pinned up. Picking her way carefully across the rock, arms slightly out for balance, looking down. 35mm from the sand below, saturated but controlled color."),
        p("55 Â· Newport Balboa Peninsula", "Sitting on the seawall on the Balboa Peninsula in the late afternoon, beach cruisers leaning against the wall, the Wedge\u2019s jetty in the distance, warm hazy light. Jean shorts, a cropped sweatshirt, ankle socks. Legs dangling over the wall, eating an ice cream, squinting. 50mm from the sand side, low angle, casual."),
        p("56 Â· Huntington Surf Lineup", "Standing waist-deep in the whitewater at Huntington holding a board under one arm, the pier off to one side, midday sun, spray in the air. Full swimsuit, wet hair slicked back, salt on her face. Wiping her eyes with the back of her wrist, mid-motion. Action camera at water level, ultra wide, droplets on the lens, horizon curved."),
        p("57 Â· Malibu PCH Pullout", "Sitting on the guardrail at a PCH pullout in Malibu at sunset, the highway curving away behind her, ocean below, warm haze and heavy backlight. Long shadow across the asphalt. Slip dress and a leather jacket, boots. Feet on the rail, arms around her knees, hair blowing across her face. 85mm from down the road, compressed, flared, cinematic."),
        p("58 Â· Venice Canals", "Walking on the narrow footbridge over the Venice canals in the morning, still green water, ducks, dense cottage gardens on both banks, soft even light. Vintage jeans, a knit vest, sunglasses. Leaning on the bridge rail looking down at the water. 35mm at f/2.8 from the far bank, gentle warm grade, very quiet."),
        p("59 Â· Silver Lake Coffee Patio", "Sitting on an outdoor patio in Silver Lake mid-morning, dappled shade from an olive tree, mismatched chairs, an iced matcha sweating on the table, a book face-down. Baggy jeans, a fitted tank, layered gold jewelry, hair clipped. Mid-laugh at someone off frame, hand near her mouth. 50mm at f/1.8 from across the table, warm neutral, extremely relaxed."),
        p("60 Â· DTLA Parking Structure", "Standing on the top deck of a downtown LA parking structure at blue hour, the skyline behind her, painted lines and yellow bollards in the foreground, sodium light just coming on. Cargo pants, a baby tee, a cropped puffer. Standing dead center facing camera, hands in pockets, deadpan. 35mm from low, symmetrical, cool grade with warm point sources."),
        p("61 Â· Palm Springs Pool", "Standing in the shallow end of a mid-century motel pool in Palm Springs at 3pm, San Jacinto rising behind the wall, hard desert sun, water caustics rippling across everything. Bright orange umbrellas and a butterfly chair on the deck. One-piece swimsuit, wet hair pushed back, sunglasses. Waist-deep with her arms resting on the pool edge, looking up at camera. 35mm from the deck, high contrast, saturated but not cartoonish."),
        p("62 Â· Joshua Tree at Sunset", "Standing between two Joshua trees on the desert floor at last light, boulder piles glowing orange behind her, long blue shadows, a huge gradient sky. Crochet top, wide-leg trousers, boots, hair down and wild. Arms loose at her sides, looking away at the light. Wide 24mm from low so the trees frame her and the sky takes two thirds. Warm highlights, cool shadows, fine grain."),
        p("63 Â· Big Bear in Winter", "Standing at the edge of Big Bear Lake in winter, snow on the pines across the water, breath visible, flat cold overcast light. Puffer jacket, beanie, gloves, red nose and pink cheeks. Hands wrapped around a thermos cup, shoulders up against the cold, laughing. 50mm at f/2, cool blue-gray grade with the warm skin tones the only color in frame."),
        p("64 Â· Catalina / Avalon Harbor", "Sitting on the steps by Avalon harbor in the morning, pastel hillside houses stacked behind, moored boats on flat clear water, the Casino building visible along the point. Bright clean light. Striped top, white shorts, sunglasses on her head. Elbows on knees, looking out at the boats. 35mm, high clarity, cool clean grade.")
      ]},
      { id: "g-4-8", title: "4.8 The Everyday \u2014 Where a Feed Actually Becomes Believable", items: [
        prose("Nobody\u2019s life is all sunset cliffs. A feed made entirely of postcard locations reads as a stock library. These are the shots that do the heavy lifting of making a person seem real."),
        p("65 Â· In-N-Out Parking Lot, Night", "Sitting on the open tailgate of a car in an In-N-Out parking lot at 10pm, the red and yellow signage glowing behind her, palm trees black against a dark sky, other cars idling. Sweats and a hoodie, hair up, no makeup. Eating fries out of the carton, mid-chew, looking at whoever is filming. Direct phone flash \u2014 hard, flat, overexposed on her face, everything past ten feet in darkness."),
        p("66 Â· Trader Joe\u2019s Run", "Pushing a cart down a grocery aisle under flat fluorescent light, hand-lettered signage and stacked product filling the frame on both sides. Bike shorts, an oversized zip-up, slides, hair in a claw clip. Reaching for something on a high shelf, up on her toes, completely mundane. 35mm from down the aisle, uncorrected greenish fluorescent cast, mild motion blur on her hand."),
        p("67 Â· Gas Station at Night", "Standing at a gas pump after dark under the canopy\u2019s harsh white light, the car door open, the pump display glowing. Everything beyond the canopy is black. Sweatpants, a crop top, a hoodie half-zipped, slides. Leaning against the car with one arm on the roof, on her phone, not looking up. 35mm from across the pump island, hard top light, deep shadows, cool white balance."),
        p("68 Â· Car Wash", "Sitting in the driver\u2019s seat during an automatic car wash, foam and water sheeting down the windshield and side glass, colored lights from the machinery bleeding through, everything outside abstract and soft. Interior light on her face is blue and shifting. Tank top, hair down, sunglasses pushed up. Head back against the headrest, eyes closed, mouth open singing. Shot from the passenger seat on a phone, 24mm, low light, grain."),
        p("69 Â· Taco Shop at 1am", "Standing at the counter of a fluorescent-lit taco shop after midnight, a wall menu board behind her, a stack of napkins, orange plastic booths. Terrible flat overhead lighting. A going-out outfit that has been through a night, mascara slightly smudged, hair falling out of its clip. Holding a foil-wrapped burrito with both hands, looking straight at the camera, exhausted and delighted. Direct flash, punchy, slightly overexposed."),
        p("70 Â· Post-Pilates Sidewalk", "Standing on a sidewalk outside a reformer studio at 8am, grip socks still on, mat under one arm, iced coffee in the other hand, morning light warm and low between buildings. Matching set, hair up, face flushed and slightly sweaty with no makeup. Mid-conversation, laughing, not looking at the lens. 50mm from across the sidewalk, warm clean grade."),
        p("71 Â· Boba Shop", "Sitting at a small table in a boba shop in the late afternoon, plastic cup with a wide straw, condensation, a stack of napkins, the neon of the shop\u2019s sign reflected faintly in the window beside her. Baggy jeans, a baby tee, layered necklaces. Chewing on the straw, looking out the window, slightly bored. 50mm at f/2 from across the table, warm interior light mixing with cool daylight from outside."),
        p("72 Â· Laundromat", "Sitting on top of a running washing machine in a laundromat, rows of white machines receding behind her, harsh overhead fluorescents, a folding table with a basket. Sweatpants, a tank, slides, hair wet from a shower. Legs swinging, on her phone, headphones in. 35mm from the far end of the row, symmetrical, uncorrected green cast, slightly grainy."),
        p("73 Â· Sunday Farmers Market Flowers", "Walking away from a flower stand with an armful of wrapped stems, market crowd soft behind her, mid-morning sun coming through the canopy. Long skirt, cropped cardigan, sunglasses on her head, tote on her shoulder. Half-turned back toward camera, laughing, flowers obscuring part of her body. 50mm at f/1.8, warm, shallow, joyful."),
        p("74 Â· Driver\u2019s Seat, Golden Hour", "Sitting in the driver\u2019s seat of a parked car at 6:45pm, low sun coming through the windshield and across her face in a hard warm band, dust visible in the beam, the rest of the interior in shadow. Sunglasses pushed up, hair down, one hand on the wheel. Turned toward the passenger seat, mid-sentence. Shot from the passenger seat on a phone at 24mm, heavy contrast, warm highlights, deep shadows."),
        p("75 Â· Backseat at Night", "Slumped in the backseat of a moving car at night, streetlights sweeping across her face in rhythmic pulses of orange, the window streaked, everything else dark. Hoodie, seatbelt across her chest, head against the window. Eyes half open, exhausted, not performing. Night mode \u2014 heavy grain, smeared highlights, lifted blacks, motion blur in the passing lights."),
        p("76 Â· Cowles Mountain Summit", "Sitting on the rock at the summit of Cowles Mountain at 7am, the whole county laid out below with the marine layer sitting in the valleys like a lake, sun just clearing the eastern hills. Leggings, a cropped windbreaker, cap, hair through the back. Flushed and out of breath, elbows on knees, looking at the view rather than the camera. 24mm wide from behind and low so the layer of fog and the sky dominate.")
      ]}
    ]
  },
  {
    id: "s05", num: "05", title: "Candid, Snapchat-Core & Chilling at Home",
    summary: "Direct-flash chaos, couch melts, kitchen counter moments, roommate-POV shots and the low-effort stuff that outperforms the polished stuff. 34 prompts.",
    groups: [
      { id: "g-5-0", title: "The physics of a low-effort photo", items: [
        prose("Four things make a snapshot read as unplanned: the light is whatever was already on (never flattering, never motivated), the framing is careless (subject off-center by accident, head clipped, horizon drunk), the expression is between two states rather than at a peak, and the frame contains clutter the photographer did not think to move. Add all four or none of them will land.")
      ]},
      { id: "g-5-1", title: "5.1 Direct Flash & Snapchat-Core", items: [
        p("Master Direct-Flash Candid", "A photo taken on a phone in a dark room with the flash firing straight at her from the lens position. The light is completely flat and unmotivated: her face is a stop overexposed with hot specular points on the nose, forehead and cheekbones, a hard-edged shadow of her head and shoulders is cast onto the wall directly behind her, and everything more than about six feet back drops into near-black. Colors are punchy and slightly wrong \u2014 skin runs warm, whites shift faintly blue, any red goes electric. Her eyes have a faint reflective warmth from the flash. Caught mid-expression, not at the peak \u2014 half a laugh, mid-word, one eye slightly more closed than the other. The framing is careless: off-center by accident, too much headroom, the phone tilted about four degrees. Ordinary clutter is visible \u2014 a charging cable, a water bottle. Front-camera image quality: soft detail, visible noise in the shadows, mild compression artifacts. Loungewear \u2014 an oversized washed-out tee and sweatpants. 9:16 vertical."),
        p("Mirror, Flash, Bathroom", "A bathroom mirror selfie taken with the flash on. The flash blows out as a hard white starburst in the mirror slightly to one side of her face, and its bloom washes the surrounding area. Warm LED strip lighting above the mirror provides the only other light. The mirror shows real glass characteristics \u2014 faint water spots, a smudge in one corner, a slightly warm tint. Holding the phone at chest height, partially obscuring her torso, elbow out. Oversized tee, sweat shorts, hair in a towel or a claw clip. Countertop clutter fully visible: skincare bottles, a hair tie, a half-drunk glass of water. Remember the mirror inverts everything \u2014 hair part, any text, tattoo sides, and which hand holds the phone."),
        p("Car, Parked, Flash On", "Sitting in the passenger seat of a parked car at night with the interior light off and the phone flash firing. Hard flat light on her face, the seat and headrest catching some spill, everything through the windows completely black except a single distant streetlight. Seatbelt still on. Hoodie, hair down and slightly flat, mascara from earlier. Head tipped against the headrest, eyebrows raised, mouth slightly open in an expression that is not quite anything. Deliberately unflattering angle from slightly below."),
        p("Bar / House Party Flash", "A flash photo taken in a crowded dim room. Two or three friends are in frame with her, everyone slightly overexposed and everything behind them black. Motion blur on someone\u2019s arm at the frame edge. Cups, a phone in someone\u2019s hand, a lamp with a shade. She is mid-laugh with her eyes squeezed shut and her head tipped back. Framing is chaotic \u2014 someone is cropped in half at the edge. The image is slightly soft everywhere because nobody held still."),
        p("The Double Chin Angle", "A front-camera photo taken from below chin height, phone held low, so the perspective is completely unflattering \u2014 the jaw shortens, the nostrils are visible, the neck compresses. Warm overhead room light from a single ceiling fixture creates raccoon shadows under her eyes. She is pulling a deliberately stupid face \u2014 eyes crossed or tongue out or eyebrows up. Zero attempt at flattery. Slightly out of focus. This is what a real photo sent to a group chat looks like.", "", "Post one of these a week. It buys enormous credibility for everything else."),
        p("Mid-Sentence, Low Light", "Caught mid-sentence in a dim room lit only by a TV and a corner lamp. Her mouth is in an awkward shape forming a word, her eyes are looking slightly off-lens, and one hand is frozen mid-gesture with visible motion blur. The lighting is mixed and ugly \u2014 blue TV wash on one side, warm tungsten on the other, neither flattering. High ISO noise throughout, soft focus. Completely unposed."),
        p("The Accidental Shot", "A photo that was clearly taken by mistake. The framing catches her from an odd angle at the frame edge, half the image is the ceiling or a blurred hand across the lens, focus is on the wrong thing entirely, and there is heavy motion blur. She is not aware the camera fired. Extremely low technical quality. Post it as the fourth or fifth slide of a carousel with no explanation."),
        p("Sun in the Eyes Selfie", "A front-camera selfie in direct harsh midday sun. She is squinting hard with one eye almost fully closed, her nose scrunched, hard shadows under her brow and nose, and the background completely blown out behind her. Skin is shiny across the forehead and nose. Sunglasses pushed up in her hair. Arm visible in the bottom corner. Overexposed, high contrast, no attempt at a good angle."),
        p("3-Photo Burst, Same Second", "Generate three near-identical frames from the same moment, taken half a second apart: the first with her eyes closed mid-blink and her mouth half open, the second with her looking off to the side and starting to laugh, the third with her fully laughing with her head turned. Identical lighting, framing and wardrobe across all three \u2014 only her expression and micro-pose change. Direct flash, dim room, phone quality.", "", "Post all three in a row. Nothing reads as more real than a burst nobody bothered to cull."),
        p("Screenshot of a Video Call", "A screenshot of her on a video call: compressed and blocky, caught mid-word with an unflattering expression, lit by a laptop screen from below and an overhead light from above. She is in a hoodie in a messy room, hair up in a clip. Low bitrate artifacts smear detail around her face and hands. Slightly stretched proportions from the aspect ratio mismatch.")
      ]},
      { id: "g-5-2", title: "5.2 Chilling in the House", items: [
        p("Kitchen Counter, Late Morning", "Leaning against a kitchen counter mid-morning with big soft window light coming from camera-right. Mug in both hands, steam rising and catching the light. Oversized tee over shorts, bare feet, hair in a messy bun with pieces down. The counter behind her is realistically lived-in \u2014 a fruit bowl, an open box of something, a dish towel, yesterday\u2019s glass. Looking down into the mug, not at the camera. 35mm at f/2 from across the room, warm natural grade."),
        p("Cereal at Midnight", "Standing at the kitchen counter at 1am eating cereal straight out of the bowl, lit only by the light over the stove and the open refrigerator glowing cold blue behind her. Sweatpants and a stretched-out tank, hair everywhere, no makeup. Mid-bite, spoon in her mouth, staring at nothing. Mixed color temperature is a mess and that is the point. High ISO, grainy, deep shadows."),
        p("Sitting on the Floor", "Sitting on the floor with her back against the couch, legs stretched out, laptop open on the coffee table in front of her. Afternoon light through a window off to one side, mostly falling across the floor rather than her. Sweats, socks, a hoodie. Head tipped back against the couch cushion, eyes closed, mid-groan. Coffee table clutter: a bowl, a candle, three remotes, mail. Shot from across the room at 35mm, low angle."),
        p("Face Mask & Hair Towel", "Sitting cross-legged on a bed with a sheet mask on her face and a towel wrapped around her head, holding up a peace sign with one hand and looking directly at the camera. Warm bedside lamp light plus the cool wash of a phone screen from below. Old tee, shorts. The mask is visibly wet and slightly slipping at one edge. Bedroom clutter fully in frame. Front camera, arm\u2019s length, soft and noisy."),
        p("Doing Nothing on the Couch", "Sprawled sideways across a couch with her legs over the armrest, phone held above her face, a blanket half fallen on the floor. The TV is on and casting a shifting blue-white light across her from the side, and a lamp somewhere behind is the only warm source. Sweats, hoodie, one sock. Completely slack expression. Shot from standing height looking down at her on a 24mm, slightly wide and distorted."),
        p("Cooking Badly", "Standing at the stove in a small kitchen, steam rising off a pan, a phone propped against a jar with a recipe on it. Overhead kitchen light plus the warm glow from under the range hood. Tank top, sweatpants, hair up, one hand holding a wooden spoon and the other hovering uselessly. Mid-motion, focused, brow slightly furrowed, cheeks flushed from the heat. Ingredients and packaging scattered on the counter. 35mm from the doorway."),
        p("Laundry Day", "Sitting on the floor of a bedroom surrounded by a defeated pile of clean laundry, folding one thing very slowly. Flat afternoon light from a window. Shorts and a sports bra with a flannel over it, hair in a claw clip. Looking at the pile with visible resignation. Realistic mess: a basket tipped over, a hanger on the floor, socks. 35mm from the doorway at standing height."),
        p("Watering the Plants", "Standing at a window sill in the morning, watering a cluster of plants from a small jug, backlit hard by the window so she is mostly in shadow with a bright rim on her hair and arm. Dust visible in the light. Slip dress or an oversized shirt, bare feet, hair down. Half-turned toward the light, absorbed. 50mm at f/1.8, deliberately underexposed on her face, blown window."),
        p("Getting Ready \u2014 Makeup Mirror", "Sitting at a small desk doing her makeup in a ring-lit mirror, the ring light producing a distinctive circular catchlight in both eyes and very even flat light on her face. Everything outside that pool of light is dim. Robe over a tank, hair clipped back off her face. Mid-application, mouth slightly open in that involuntary way. Makeup spread chaotically across the desk. 50mm from the side so both her face and her reflection are in frame."),
        p("Shower Steam Bathroom", "Standing in a bathroom thick with shower steam, the mirror mostly fogged with a swipe cleared through it, warm light diffusing through the moisture. Towel-dried hair, a robe, bare face, skin flushed pink from the heat. Wiping at the mirror with the side of her hand. The steam softens the entire image and creates visible glow around the light fixture. 35mm, low contrast, warm, slightly hazy throughout."),
        p("Dancing in the Kitchen", "Mid-dance in a kitchen in socks, caught in an awkward transitional position with her arms up and her hair mid-swing, motion blur on her hands and hair, one foot off the ground. Warm evening light plus overhead. Sweatpants and a cropped tee. Eyes closed, mouth open singing. The framing is bad because whoever is filming is also laughing. 24mm handheld, slow shutter, real blur."),
        p("Reading, Ignored", "Curled in an armchair by a window in the late afternoon reading a paperback, low warm light raking across her and the chair, dust in the beam. Sweater, shorts, socks, hair down over her shoulder. Fully absorbed, unaware of the camera, one hand holding the page. 85mm from across the room, shallow, quiet. Nothing about this looks like it was made for anyone."),
        p("Sunday Reset", "Standing in the middle of a partly-cleaned room holding a stack of folded towels, a vacuum abandoned mid-floor, a trash bag half full, windows open with bright flat daylight coming in. Bike shorts, an old tee, hair up, headphones on. Looking around the room deciding what to do next. 35mm from the doorway, natural light, high clarity, ordinary."),
        p("Balcony, End of Day", "Sitting on a small apartment balcony at sunset with her feet up on the railing, a drink beside her, string lights not yet on, the sky doing something extravagant behind neighboring rooftops. Sweats and a tank, blanket over her lap. Looking out, phone face-down beside her. 35mm from inside the doorway looking out, so the frame of the door edges the composition. Warm, low contrast, hazy.")
      ]},
      { id: "g-5-3", title: "5.3 \u201cSomeone Else Took This\u201d", items: [
        prose("The photographic difference between a selfie and a photo of you is enormous, and an account made entirely of selfies is instantly legible as one person alone with an AI model. Mix these in constantly."),
        p("Roommate POV", "Photographed by someone sitting across the room from her who has just picked up their phone. The angle is from a seated height, slightly to one side, with a doorframe or a plant partly obstructing the left edge of the frame. She is not looking at the camera and has not noticed it. The lighting is whatever the room already had. Framing is casual and slightly poorly composed. Phone quality, no flash, mild motion softness."),
        p("Walking Ahead", "Photographed from behind and slightly to the side as she walks ahead down a sidewalk, half-turning back over her shoulder toward the camera with a real reactive expression \u2014 she has just been called. Natural walking gait with one foot mid-lift and correct arm swing. Hair moving. Slight motion blur on the lower body, face sharp. 35mm handheld at the photographer\u2019s eye level."),
        p("Across the Table", "Photographed from directly across a restaurant table, the near edge of the table and a blurred glass in the foreground. She is mid-conversation, gesturing with one hand, looking slightly off-lens at the person she is talking to. Warm restaurant lighting from above and a candle on the table adding a low warm point. 50mm at f/1.8, focus on her eyes, the room behind dissolved."),
        p("Group Shot, She\u2019s Not the Point", "A group photo with three or four friends where she is not centered and not the focus \u2014 second from the left, partly obscured by someone\u2019s shoulder, mid-laugh. Everyone is slightly overexposed by the flash. The composition is bad, someone has their eyes closed, and someone at the edge is cropped in half. Faces of the others are turned away, in shadow, or partly out of frame.", "", "Keep other faces indistinct. This is a composition tool, not an occasion to invent a cast."),
        p("The Unflattering One", "A photo taken of her at exactly the wrong moment: mid-blink, mid-chew, one shoulder up, a strange half-expression, terrible overhead lighting casting shadows under her eyes. The composition is fine but the timing is a disaster. Sharp and technically correct, which makes it worse. Completely believable."),
        p("Shot from Behind, Looking Out", "Photographed entirely from behind as she stands looking out at something \u2014 a view, a window, the ocean. Her face is not visible at all. The composition is about her silhouette against the light and the space in front of her. Hair, the line of her shoulders and the shape of her clothing carry the whole frame. 50mm, backlit, quiet.", "", "Faceless slides are free content that carries zero identity-drift risk.")
      ]}
    ]
  },
  {
    id: "s06", num: "06", title: "Lazy, Tired & Horizontal",
    summary: "Front-camera in-bed shots with correct gravity, pillow physics and just-woke-up detail. 22 prompts.",
    groups: [
      { id: "g-6-1", title: "6.1 The Physics of Lying Down", items: [
        prose("Almost every AI in-bed image fails on the same four points. Name all four explicitly and the shot lands."),
        table(["What breaks", "What to say instead"], [
          ["Gravity on the face", "The cheek in contact with the pillow compresses and pushes slightly upward; the upper cheek and mouth corner pull toward the mattress; the eye on the pillow side narrows."],
          ["Hair", "Hair falls sideways onto the pillow and fans out, it does not hang as if upright. Sections are pushed flat and creased on the contact side."],
          ["Bedding", "The pillow deforms under the weight of her head with real compression and radiating fold lines; the duvet has volume and drapes over the body\u2019s contours, with a bunched edge and a wrinkled sheet."],
          ["Camera orientation", "The phone is held above her, roughly parallel to her face, so the frame is rotated relative to the room \u2014 the mattress edge and headboard run vertically or diagonally, not horizontally."]
        ])
      ]},
      { id: "g-6-2", title: "6.2 In Bed", items: [
        p("Master Horizontal Front-Camera", "A front-camera phone photo taken by the subject while lying on her side in bed. She is fully horizontal, her head resting on a pillow, holding the phone above her with one arm at roughly forearm\u2019s length, angled down at her face and held approximately parallel to it \u2014 so the frame is rotated relative to the room and the mattress edge, headboard and duvet all run diagonally through the composition rather than level. Gravity is visibly acting on her: the cheek in contact with the pillow is compressed and pushed slightly upward, the eye on that side is narrower, the corner of her mouth on the pillow side pulls toward the mattress, and her hair falls sideways onto the pillow and fans across it with a section pressed flat and creased. She has a faint pillow crease across the cheek and mild puffiness under both eyes. Her expression is barely awake \u2014 eyes half-open and unfocused, one eyebrow slightly higher, mouth relaxed and slightly open. Oversized worn cotton t-shirt; the duvet is pulled up to her ribs with real volume and weight, draping over the shoulder and arm with soft folds radiating from the compression points. The sheet beneath is visibly wrinkled. Lighting is soft, low, from one side \u2014 a curtain gap or a bedside lamp \u2014 leaving half her face in gentle shadow with no fill. Front camera image quality: soft detail, visible noise in the shadows, mild wide-angle distortion enlarging whatever is closest to the lens, a hair of motion softness. Her free arm is partly visible at the bottom edge. No makeup, natural skin with visible texture, slight oiliness on the nose and forehead. 9:16 vertical.", "THE ONE YOU ASKED FOR"),
        p("Just Woke Up", "The same horizontal front-camera setup, taken within a minute of waking. Add: heavier eye puffiness, a visible pillow crease running diagonally across one cheek, hair genuinely wrecked with a section standing up and a section flattened, one eye more open than the other, and the specific slack quality of a face that has not yet done anything. Early morning light is cold and blue through a curtain gap. She is squinting slightly against the phone screen\u2019s brightness, which also casts a faint cool glow up onto her face."),
        p("3am, Can\u2019t Sleep", "Lying on her back in the dark, phone held directly above her face, the screen being the only light source in the entire frame \u2014 harsh cold light from below and slightly to one side, throwing upward shadows under her brow, nose and chin. Everything beyond about two feet is completely black. Her hair is spread on the pillow beneath her. Expression flat and tired, eyes fully open, looking directly into the lens. Heavy noise, poor detail, blown highlights where the screen light hits. Absolutely no glamour."),
        p("Face Half in the Pillow", "Lying face-down and slightly turned, with the lower half of her face buried in the pillow so only one eye, an eyebrow and a bit of nose are visible above it. The pillow deforms significantly around her face. Hair falls forward across her forehead and into the frame. The visible eye is open and looking straight at the lens with an expression somewhere between amused and dead. Phone held above and to the side. Soft morning light. Deeply ordinary."),
        p("Duvet Over the Head", "The duvet pulled up over her head so she is in a soft cave of fabric, with only her face visible in the opening and diffused light filtering through the material giving everything a warm even glow. The fabric folds close around her face and casts soft shadow. Hair mostly hidden. Eyes closed or barely open, small smile. Phone held close above her inside the space. Very low contrast, warm, soft focus."),
        p("Arm Out from Under", "Photographed from above, lying on her back with the duvet pulled up to her chin and one bare arm reaching out from under it holding the phone. The arm is the closest thing to the lens so it is exaggerated by the wide angle and slightly out of focus at the wrist. Her face is small and centered lower in the frame, half in shadow. Bedding fills most of the composition. Soft directional morning light from one side."),
        p("Sunlight Through the Blinds", "Lying on her side in bed with hard morning sun coming through venetian blinds, casting sharp bright stripes across her face, the pillow and the duvet. She is squinting into the light with one eye closed, one hand half raised to block it. The stripes must follow the contours they fall on \u2014 bending over her cheek, breaking across the folds of the bedding. Deep contrast between the lit bands and the shadow between them, with dust visible in the beams. Warm."),
        p("Sick Day", "Lying in bed mid-afternoon looking genuinely unwell: pale skin with faint flush high on the cheeks, slightly glassy eyes, a red nose, hair scraped into a failing bun. A crumpled tissue and a mug on the nightstand, a hoodie worn in bed, the duvet pulled up. Flat gray daylight through a curtain. Front camera from above, no effort at all, eyes barely open. Slightly soft, noisy, and honest."),
        p("Sunday Morning, Not Moving", "Lying diagonally across an unmade bed on her stomach, propped on her forearms with the phone flat on the mattress in front of her, chin down, looking into it. Soft late-morning light from a window behind her creating a rim on her hair and shoulders while her face is in gentle shadow. Duvet twisted, pillows displaced, a book and a phone charger visible. Oversized tee, hair falling forward around her face. Shot from the phone\u2019s position looking slightly up at her."),
        p("Half-Awake Yawn", "Caught mid-yawn in bed \u2014 eyes squeezed shut, mouth wide, nose scrunched, one hand half-covering it too late. Completely unflattering and totally involuntary. Hair everywhere. Soft morning light from the side. Front camera held above, slight motion blur on the hand. The photo is technically a mess and that is why it works."),
        p("Pet in the Bed", "Lying on her side in bed with a cat curled against her chest or a dog stretched out along her legs, the animal asleep and completely uninterested. She is looking at the animal rather than the camera, with a small real smile. Soft morning light. The animal\u2019s weight visibly depresses the duvet. Front camera held above and angled to include both of them. Warm, quiet, low contrast."),
        p("Phone Light in the Dark", "Lying on her side in a completely dark room, lit only by the phone screen a few inches from her face. Extremely harsh, cold, close light with a rapid falloff \u2014 her face is bright, the pillow beside her is dim, and everything beyond is black. The light source is so close it wraps oddly around her nose and creates a hard shadow on the pillow. Screen reflection visible in her eyes. Heavy noise, low detail, poor color. Expression completely blank."),
        p("Blanket Burrito, Upright", "Sitting up in bed completely wrapped in a duvet with only her face and one hand visible, hair sticking out of the top, propped against the headboard. Warm bedside lamp light from one side. Expression aggressively unimpressed. Front camera at arm\u2019s length from slightly above. Bedroom clutter behind her: a water glass, a charger, a pile of clothes on a chair.")
      ]},
      { id: "g-6-3", title: "6.3 Horizontal, Not In Bed", items: [
        p("Couch Melt", "Lying flat on her back on a couch with her head on the armrest and her legs up over the other end, phone held above her face. The couch cushion deforms under her head and shoulders. TV light washing across her from the side in a shifting cool tone, a lamp providing warm fill from behind. Sweats, one sock on, a blanket half over her legs. Eyes half closed, expression completely vacant. Frame rotated relative to the room."),
        p("Floor, Defeated", "Lying on her back on a rug on the floor, arms out, photographed from directly above at standing height. The wide lens exaggerates her toward the center and compresses the room around the edges. Flat overhead light. Sweatpants and a tee, hair fanned out on the rug, headphones beside her. Eyes closed, mouth slightly open, entirely inert. Ordinary floor clutter in frame \u2014 a charging cable, a laundry pile edge, a shoe."),
        p("Beach Towel, Face Down", "Lying face down on a towel on the sand in the late afternoon, head turned to one side with her cheek on her folded arms, sunglasses pushed up into her hair, sand stuck to her forearm and shoulder. Low warm sun raking across her from the side, throwing long shadows in the sand\u2019s texture. Eyes closed. Shot from ground level a few feet away on a 35mm, so the sand grains in the immediate foreground are out of focus."),
        p("Backseat, Asleep", "Slumped sideways across the backseat of a car with her head against the window and a hoodie balled up as a pillow, actually asleep. Daylight through the window is harsh and blows out one side of her face while the interior stays dark. Seatbelt still fastened across her. Photographed from the front seat looking back, phone at an awkward angle, slightly out of focus. Completely unaware."),
        p("Hammock / Lounge Chair", "Lying in a hammock or a lounge chair in dappled shade, one arm hanging off the side, a book face-down on her stomach, sunglasses on. The dappled light moves across her in irregular bright patches. Loose linen shirt over a swimsuit. Head tipped back, mouth slightly open, asleep. 50mm from a few feet away at chair height. Warm, hazy, still."),
        p("Grass, Looking Up", "Lying on her back in grass photographed from directly above, hair spread out around her head, blades of grass in the immediate foreground blurred at the frame edges. Late afternoon sun from one side. Squinting up into the lens with one hand raised to shade her eyes, so her palm is partly in frame and closest to the camera. Sunglasses on the grass beside her. 24mm, wide and slightly distorted.")
      ]},
      { id: "g-6-4", title: "6.4 Tired-Face Add-Ons", items: [
        prose("Append any of these to a portrait or in-bed prompt to push the exhaustion further."),
        block("Exhaustion Detail Block", "Add the physical signs of genuine tiredness: mild puffiness in the lower lids, faint blue-violet shadow under both eyes, slightly reduced skin tone with a marginally sallow cast, eyes that are a touch glassy with slightly reddened lower waterlines, a lower eyelid position that makes the eyes read heavy, and a general softening of facial muscle tone so the face is not holding any expression. Hair is unstyled and shows real overnight disruption. Lips are slightly dry.", "APPEND TO A PORTRAIT"),
        block("Just-Woke-Up Detail Block", "Add: a pillow crease running diagonally across one cheek and fading toward the jaw, a small amount of hair flattened and creased on the contact side with a section standing up at the crown, slight redness on the ear that was against the pillow, marginal facial asymmetry from sleeping on one side, and eyes that have not fully focused \u2014 pupils slightly wide, gaze a few degrees off the lens.", "APPEND FOR MORNING SHOTS")
      ]}
    ]
  },
  {
    id: "s07", num: "07", title: "Feed & Story Formats",
    summary: "4:5 heroes, carousel shot lists, 9:16 stories with sticker-safe negative space, on-image text, and grid planning. 18 prompts.",
    groups: [
      { id: "g-7-1", title: "7.1 Feed Heroes (4:5)", items: [
        p("The 4:5 Portrait Hero", "Compose for a 4:5 vertical Instagram feed post. Frame her from mid-thigh up, positioned on the left vertical third with her eyeline on the upper horizontal third and clean uncluttered space filling the right side. The background is simple enough that she separates instantly at thumbnail size. One dominant color in the frame plus neutrals. Strong directional light. The image must be legible and compelling when reduced to a one-inch square, which means large shapes and high contrast between subject and background rather than fine detail."),
        p("The Scroll-Stopper", "Compose for maximum thumbnail impact at 4:5. One bold graphic element dominates \u2014 a saturated wall, an enormous sky gradient, a single hard shadow shape, a strong repeating pattern \u2014 and she occupies roughly a quarter of the frame within it. High contrast, minimal clutter, one unexpected color. The composition should be readable as a shape from across a room."),
        p("The Negative Space Post", "Compose at 4:5 with her small in the lower third of the frame and roughly sixty percent of the image given over to empty space above \u2014 open sky, a blank wall, water. She is a small dark shape in a large quiet field. Restrained color, low contrast in the empty area, a single point of interest. Quiet, confident, and unusually effective in a busy feed."),
        p("The Grid-Safe Crop", "Compose at 4:5 but keep the essential subject matter inside a centered square, because the profile grid will crop this to 1:1. Nothing important \u2014 not her face, not her hands, not the point of the image \u2014 may live in the top or bottom eighth of the frame. The extra vertical space carries atmosphere only.", "", "This one rule will save you more re-generations than anything else in this section.")
      ]},
      { id: "g-7-2", title: "7.2 Carousels \u2014 Complete Shot Lists", items: [
        prose("Generate each slide as a separate run and pass the previous slide as a grade reference (\u00a72.3, Match to a Reference Grade) so the set hangs together."),
        p("Carousel A Â· \u201cBeach Day\u201d", "1. Hero 4:5, her walking on wet sand at golden hour, backlit, mid-stride. 2. Detail \u2014 her feet in the shallow water, sand and foam, shot straight down. 3. Faceless \u2014 from behind, sitting on a towel looking out. 4. Direct-flash candid of her in the car afterward, hair wet, hoodie on. 5. Object shot \u2014 sunglasses, a book and a half-eaten snack on a towel, no person. 6. The bad one \u2014 mid-blink, hair across the face, terrible timing. 7. Wide landscape, the beach nearly empty, her tiny in frame.", "7 SLIDES"),
        p("Carousel B Â· \u201cSlow Sunday\u201d", "1. Bed, front camera, half awake, 9:16 cropped to 4:5. 2. Kitchen counter with coffee, window light, from across the room. 3. Detail \u2014 hands around a mug, steam, shallow focus. 4. Floor with laundry, defeated, wide from the doorway. 5. Balcony at sunset, feet on the railing, faceless. 6. Flash photo at 11pm eating cereal, harsh and unflattering.", "6 SLIDES"),
        p("Carousel C Â· \u201cNorth County Dump\u201d", "1. Encinitas boathouses, midday, squinting. 2. Blurred hand-held shot of the 101 through a car window. 3. Swami\u2019s overlook from behind, watching the lineup. 4. Detail \u2014 wet feet on hot pavement. 5. Someone else\u2019s dog on the beach. 6. Fish tacos on a paper plate, top-down. 7. Eucalyptus tunnel at Leucadia, backlit, arms out. 8. Mid-laugh flash photo at dusk. 9. Sunset over the water, no person at all.", "9 SLIDES", "The ratio that works: roughly one third of a photo dump should contain no face, and at least one slide should be technically bad."),
        p("Carousel D Â· \u201cOne Outfit, Five Angles\u201d", "Generate one hero image, then use Change the Camera Angle (\u00a72.6) five times on the same frame: straight on, forty degrees left, forty degrees right, from behind over the shoulder, and a low three-quarter. Identical wardrobe, lighting, location and grade across all five \u2014 only the camera moves. This is the cheapest possible way to turn one good generation into a full post.", "5 SLIDES")
      ]},
      { id: "g-7-3", title: "7.3 Stories (9:16)", items: [
